</main><script id="lesson-data" type="application/json">{"vocab":[{"hanzi":"生日","pinyin":"shēngrì","meaning":"sinh nhật","example":"明天是妈妈的生日。"},{"hanzi":"快乐","pinyin":"kuàilè","meaning":"vui vẻ","example":"祝你生日快乐！"},{"hanzi":"忘","pinyin":"wàng","meaning":"quên","example":"我差点儿忘了带礼物。"},{"hanzi":"画画","pinyin":"huàhuà","meaning":"vẽ tranh","example":"奶奶喜欢画画。"},{"hanzi":"画笔","pinyin":"huàbǐ","meaning":"bút vẽ","example":"我买了一盒彩色画笔。"},{"hanzi":"蛋糕","pinyin":"dàngāo","meaning":"bánh kem","example":"大家一起吃生日蛋糕。"},{"hanzi":"打开","pinyin":"dǎkāi","meaning":"mở ra","example":"请打开这个盒子。"},{"hanzi":"舒服","pinyin":"shūfu","meaning":"dễ chịu","example":"这张床很舒服。"},{"hanzi":"长","pinyin":"cháng","meaning":"dài","example":"这条鱼很长。"},{"hanzi":"什么的","pinyin":"shénmede","meaning":"vân vân","example":"我们买水果、花什么的。"},{"hanzi":"地","pinyin":"de","meaning":"trợ từ trạng ngữ","example":"她开开心心地笑了。"},{"hanzi":"礼物","pinyin":"lǐwù","meaning":"quà tặng (ôn Bài 5)","example":"我给爷爷准备了一份礼物。"},{"hanzi":"准备","pinyin":"zhǔnbèi","meaning":"chuẩn bị (ôn Bài 5)","example":"妈妈正在准备晚饭。"},{"hanzi":"等","pinyin":"děng","meaning":"đợi (ôn Bài 5)","example":"等我一会儿吧。"},{"hanzi":"来","pinyin":"lái","meaning":"đến/hướng về (ôn bài trước)","example":"朋友上来了。"}],"questions":[{"section":"v2","type":"mc","stem":"妈妈的生日快到了，我想给她买一份____。","opts":["礼物","比赛","车票"],"answer":0,"ex":"生日常见搭配：买一份礼物。","kind":"vocab","id":"b6_001","target":"礼物"},{"section":"v2","type":"mc","stem":"小丽在纸上画了一只猫，她很喜欢____。","opts":["打球","画画","游泳"],"answer":1,"ex":"在纸上画东西：画画。","kind":"vocab","id":"b6_002","target":"画画"},{"section":"v3","type":"mc","stem":"弟弟把盒子____，看见里面有一盒彩笔。","opts":["忘了","打开","回来"],"answer":1,"ex":"打开盒子：mở hộp.","kind":"vocab","id":"b6_003","target":"打开"},{"section":"v3","type":"mc","stem":"明天是爷爷的生日，我们今天要先____好晚饭。","opts":["准备","游泳","介绍"],"answer":0,"ex":"准备好晚饭：chuẩn bị xong bữa ăn.","kind":"vocab","id":"b6_004","target":"准备"},{"section":"v3","type":"mc","stem":"这条鱼很____，快有一米了。","opts":["远","长","快"],"answer":1,"ex":"Dùng 长 mô tả cá có chiều dài lớn.","kind":"vocab","id":"b6_005","target":"长"},{"section":"v3","type":"mc","stem":"这张床很____，奶奶睡得很好。","opts":["舒服","安静","客气"],"answer":0,"ex":"舒服 mô tả cảm giác dễ chịu khi nằm ngủ.","kind":"vocab","id":"b6_006","target":"舒服"},{"section":"v4","type":"mc","stem":"小朋友想画一张生日卡片，最需要什么？","opts":["画笔和纸","奶茶和米饭","车票和地图"],"answer":0,"ex":"Vẽ thiệp cần bút vẽ và giấy.","kind":"vocab","id":"b6_007","target":"画笔"},{"section":"v4","type":"mc","stem":"妈妈说：“我忘了今天是你的生日！”她的意思是：","opts":["她早就记得很清楚。","她没有记住这个生日。","她不喜欢过生日。"],"answer":1,"ex":"忘了 = không nhớ, đã quên.","kind":"vocab","id":"b6_008","target":"忘"},{"section":"v4","type":"mc","stem":"朋友送你一个蛋糕，你最自然的回答是：","opts":["谢谢你！你太客气了！","今天的车票在哪儿？","我去学校打篮球。"],"answer":0,"ex":"Nhận quà nên cảm ơn lịch sự.","kind":"vocab","id":"b6_009","target":"蛋糕"},{"section":"v4","type":"mc","stem":"孩子过生日，大家一起唱歌。最合适的祝福是：","opts":["祝你生日快乐！","请问洗手间在哪儿？","你怎么还不下去？"],"answer":0,"ex":"生日快乐 là lời chúc sinh nhật phổ biến.","kind":"vocab","id":"b6_010","target":"生日"},{"section":"g1","type":"mc","stem":"大家高高兴兴地进了教室。这里“高高兴兴地”说明：","opts":["怎么进教室","去了哪个教室","什么时候进教室"],"answer":0,"ex":"“地”连接状语 cách thức với động từ.","kind":"grammar","id":"b6_011"},{"section":"g1","type":"mc","stem":"哪一句的“地”用得正确？","opts":["妹妹认真地画了一张画。","妹妹认真得画了一张画。","妹妹认真了画一张画。"],"answer":0,"ex":"Trạng từ/cụm miêu tả cách thức + 地 + động từ.","kind":"grammar","id":"b6_012"},{"section":"g1","type":"mc","stem":"看到教室很干净，老师会说：","opts":["教室干干净净的。","教室干净净净的。","教室干干净的。"],"answer":0,"ex":"干净 là tính từ song âm tiết, láy AABB → 干干净净.","kind":"grammar","id":"b6_013"},{"section":"g1","type":"mc","stem":"哪一句最自然地描述“走得慢”的样子？","opts":["他慢慢地走进房间。","他慢慢得走进房间。","他慢慢地走进来房间。"],"answer":0,"ex":"慢慢地 + động từ; tân ngữ nơi chốn đứng trước 来.","kind":"grammar","id":"b6_014"},{"section":"g1","type":"mc","stem":"周末我们可以买水果、蛋糕什么的。“什么的”表示：","opts":["还包括其他类似的东西","只能买这两样东西","不知道蛋糕是什么"],"answer":0,"ex":"“什么的” liệt kê mở, nghĩa là “v.v.”","kind":"grammar","id":"b6_015"},{"section":"g1","type":"mc","stem":"下面哪句“什么的”最自然？","opts":["我喜欢打篮球、游泳什么的。","我什么的喜欢打篮球。","打什么的篮球游泳我。"],"answer":0,"ex":"“什么的” ở sau danh sách hoạt động cùng loại.","kind":"grammar","id":"b6_016"},{"section":"g1","type":"mc","stem":"妈妈问：“生日想吃什么？”最自然的回答是：","opts":["吃面条、鱼什么的都可以。","什么的面条、鱼我吃。","我吃什么的面条昨天。"],"answer":0,"ex":"Cụm liệt kê thực phẩm + 什么的 đúng vị trí.","kind":"grammar","id":"b6_017"},{"section":"g2","type":"order","stem":"请把词语排成一句自然、通顺的话。","tokens":["孩子们","开开心心地","唱","生日歌"],"answer":["孩子们","开开心心地","唱","生日歌"],"model":"孩子们开开心心地唱生日歌。","ex":"AABB + 地 làm trạng ngữ của 唱.","kind":"grammar","id":"b6_018"},{"section":"g2","type":"order","stem":"请把词语排成一句自然、通顺的话。","tokens":["我们","买","水果","、","蛋糕","什么的"],"answer":["我们","买","水果","、","蛋糕","什么的"],"model":"我们买水果、蛋糕什么的。","ex":"什么的 đặt cuối một chuỗi danh từ cùng loại.","kind":"grammar","id":"b6_019"},{"section":"g2","type":"order","stem":"请把词语排成一句自然、通顺的话。","tokens":["姐姐","慢慢地","走进","房间"],"answer":["姐姐","慢慢地","走进","房间"],"model":"姐姐慢慢地走进房间。","ex":"慢慢地 đứng trước động từ; tân ngữ phòng đứng sau 走进.","kind":"grammar","id":"b6_020"},{"section":"l1","type":"mc","stem":"奶奶什么时候过生日？","opts":["星期日","星期五","星期三"],"answer":0,"ex":"Nghe: 星期日是奶奶的生日。","kind":"listening","id":"b6_021","track":"L1"},{"section":"l1","type":"mc","stem":"奶奶喜欢做什么？","opts":["游泳","画画","踢足球"],"answer":1,"ex":"Nghe: 奶奶喜欢画画。","kind":"listening","id":"b6_022","track":"L1"},{"section":"l1","type":"mc","stem":"小明想自己做什么？","opts":["一张生日卡片","一杯奶茶","一双鞋"],"answer":0,"ex":"Nghe: 我还想做一张生日卡片。","kind":"listening","id":"b6_023","track":"L1"},{"section":"l1","type":"mc","stem":"他们打算什么时候去商场？","opts":["星期天早上","星期六下午","星期二晚上"],"answer":1,"ex":"Nghe: 那我们星期六下午去商场吧。","kind":"listening","id":"b6_024","track":"L1"},{"section":"l1","type":"mc","stem":"去商场以前，小明要先做什么？","opts":["吃蛋糕","给朋友打电话","把作业做完"],"answer":2,"ex":"Nghe: 先把作业做完，我们再一起去。","kind":"listening","id":"b6_025","track":"L1"},{"section":"l1","type":"mc","stem":"爸爸为什么先不让小雪进客厅？","opts":["大家在准备生日会","客厅里没有人","小雪要去上课"],"answer":0,"ex":"Nghe: 我们在准备一个小小的生日会。","kind":"listening","id":"b6_026","track":"L2"},{"section":"l1","type":"mc","stem":"妈妈什么时候让小雪进来？","opts":["明天早上","准备好以后","朋友走了以后"],"answer":1,"ex":"Nghe: 好了！小雪，快进来吧！","kind":"listening","id":"b6_027","track":"L2"},{"section":"l1","type":"mc","stem":"桌子上除了蛋糕还有什么？","opts":["书和画笔","鞋和帽子","鱼和面条"],"answer":2,"ex":"Nghe: 桌子上有蛋糕，还有鱼、面条什么的。","kind":"listening","id":"b6_028","track":"L2"},{"section":"l1","type":"mc","stem":"妈妈让小雪先做什么？","opts":["先打开礼物","先回学校","先下楼等人"],"answer":0,"ex":"Nghe: 先打开礼物，再和大家一起吃饭。","kind":"listening","id":"b6_029","track":"L2"},{"section":"l1","type":"mc","stem":"小雪最后心情怎么样？","opts":["很着急","很高兴","不舒服"],"answer":1,"ex":"Nghe: 我很高兴。","kind":"listening","id":"b6_030","track":"L2"},{"section":"l1","type":"mc","stem":"安妮现在在哪里？","opts":["楼下","电影院","教室里"],"answer":0,"ex":"Nghe: 我到楼下了。","kind":"listening","id":"b6_031","track":"L3"},{"section":"l1","type":"mc","stem":"安妮给小雪带了什么？","opts":["画笔","生日蛋糕","中文书"],"answer":2,"ex":"Nghe: 我给你带了一本中文书。","kind":"listening","id":"b6_032","track":"L3"},{"section":"l1","type":"mc","stem":"朋友们正在做什么？","opts":["打篮球","唱歌","买车票"],"answer":1,"ex":"Nghe: 朋友们正在开开心心地唱歌。","kind":"listening","id":"b6_033","track":"L3"},{"section":"l1","type":"mc","stem":"他们打算唱歌以后做什么？","opts":["吃蛋糕","去酒店","去机场"],"answer":0,"ex":"Nghe: 唱完歌，我们再吃蛋糕。","kind":"listening","id":"b6_034","track":"L3"},{"section":"l1","type":"mc","stem":"小雪的生日是哪一天？","opts":["明天","昨天","下个星期"],"answer":1,"ex":"Nghe: 昨天是我的生日。","kind":"listening","id":"b6_035","track":"L4"},{"section":"l1","type":"mc","stem":"爸爸给小雪买了什么？","opts":["一个蛋糕","一件红衣服","两张电影票"],"answer":0,"ex":"Nghe: 爸爸买了一个大蛋糕。","kind":"listening","id":"b6_036","track":"L4"},{"section":"l1","type":"mc","stem":"小雪收到的礼物里有什么？","opts":["鱼和面条","水果和奶茶","画笔和书"],"answer":2,"ex":"Nghe: 朋友送了我画笔和一本书。","kind":"listening","id":"b6_037","track":"L4"},{"section":"l1","type":"mc","stem":"朋友们什么时候回家？","opts":["上午十点以前","晚上十点以前","晚上十二点以后"],"answer":1,"ex":"Nghe: 十点以前就回家了。","kind":"listening","id":"b6_038","track":"L4"},{"section":"r1","type":"mc","stem":"小明和妈妈什么时候去买礼物？","opts":["星期六下午","星期日晚上","星期五早上"],"answer":0,"ex":"Đoạn đọc: 文中说“星期六下午去商场”。","kind":"reading","id":"b6_039","passage":"R1"},{"section":"r1","type":"mc","stem":"小明送礼物以前先做了什么？","opts":["买电影票","写生日卡片","去学校上课"],"answer":1,"ex":"Đoạn đọc: 先写好卡片，再送礼物。","kind":"reading","id":"b6_040","passage":"R1"},{"section":"r1","type":"mc","stem":"安妮现在在哪儿？","opts":["客厅里","商场里","小雪家楼下"],"answer":2,"ex":"Đoạn đọc: 消息中说“我已经到你家楼下了”。","kind":"reading","id":"b6_041","passage":"R2"},{"section":"r1","type":"mc","stem":"小雪打算先做什么？","opts":["先唱歌","先吃蛋糕","先去买花"],"answer":0,"ex":"Đoạn đọc: “先唱歌，再吃蛋糕”。","kind":"reading","id":"b6_042","passage":"R2"},{"section":"r1","type":"mc","stem":"刘老师下午做了什么？","opts":["去商场买衣服","在家准备晚饭","跟朋友去看电影"],"answer":1,"ex":"Đoạn đọc: 下午在家准备晚饭。","kind":"reading","id":"b6_043","passage":"R3"},{"section":"r1","type":"mc","stem":"朋友们几点左右离开？","opts":["八点半","十点半","九点半"],"answer":2,"ex":"Đoạn đọc: 文中说“九点半就回家了”。","kind":"reading","id":"b6_044","passage":"R3"},{"section":"w1","type":"open","stem":"今天是好朋友的生日。请写一句祝福的话，并使用“生日快乐”。","model":"祝你生日快乐！希望你今天很开心。","answer":"祝你生日快乐！希望你今天很开心。","keywords":"生日快乐","ex":"Lời chúc ngắn, lịch sự.","kind":"writing","id":"b6_045"},{"section":"w1","type":"open","stem":"你想送给喜欢画画的朋友一份礼物。请用“画笔”写一句话。","model":"我想给她买一盒彩色画笔。","answer":"我想给她买一盒彩色画笔。","keywords":"画笔","ex":"Đặt câu theo tình huống tặng quà.","kind":"writing","id":"b6_046"},{"section":"w1","type":"open","stem":"朋友收到生日礼物很开心。请用“高高兴兴地”写一句话。","model":"她高高兴兴地打开了礼物。","answer":"她高高兴兴地打开了礼物。","keywords":"高高兴兴地","ex":"Dùng cụm AABB + 地 + động từ.","kind":"writing","id":"b6_047"},{"section":"w1","type":"open","stem":"请写一句话，介绍生日桌上有什么，并使用“什么的”。","model":"桌子上有蛋糕、水果、面条什么的。","answer":"桌子上有蛋糕、水果、面条什么的。","keywords":"什么的","ex":"“什么的” đặt sau danh sách cùng loại.","kind":"writing","id":"b6_048"},{"section":"w2","type":"open","stem":"朋友在楼下等你，你还在家里准备蛋糕。请回复朋友（1–2句），使用“一会儿”。","model":"请等我一会儿，我马上下来。","answer":"请等我一会儿，我马上下来。","keywords":"一会儿","ex":"Tái sử dụng bổ ngữ hướng Bài 5.","kind":"writing","id":"b6_049"},{"section":"w2","type":"open","stem":"你第一次去同学家参加生日会。主人开门后，你怎么打招呼并说明来意？写1–2句。","model":"你好！祝你生日快乐！这是送给你的礼物。","answer":"你好！祝你生日快乐！这是送给你的礼物。","keywords":"生日快乐|礼物","ex":"Chào hỏi, tặng quà tự nhiên.","kind":"writing","id":"b6_050"},{"section":"w2","type":"open","stem":"你和朋友想给奶奶准备生日饭。请用“准备”写一句分工的话。","model":"我来准备水果，你来做面条，好吗？","answer":"我来准备水果，你来做面条，好吗？","keywords":"准备","ex":"Vận dụng ngữ liệu Bài 5 trong chủ đề Bài 6.","kind":"writing","id":"b6_051"},{"section":"w2","type":"open","stem":"弟弟想在房间里画画。你请他把画笔拿进来。写一句话。","model":"请把画笔拿进来，我们一起画画吧。","answer":"请把画笔拿进来，我们一起画画吧。","keywords":"画笔|拿进来","ex":"Vị trí/hướng nói và lời mời hợp lý.","kind":"writing","id":"b6_052"},{"section":"w3","type":"open","stem":"A：今天是妈妈的生日，你给她准备了什么？\nB：____（用“蛋糕”回答）","model":"我给她准备了一个蛋糕。","answer":"我给她准备了一个蛋糕。","keywords":"蛋糕","ex":"Trả lời đúng câu hỏi về quà.","kind":"writing","id":"b6_053"},{"section":"w3","type":"open","stem":"A：你们买了什么菜？\nB：____（列举两样食品，用“什么的”）","model":"我们买了鱼、鸡蛋什么的。","answer":"我们买了鱼、鸡蛋什么的。","keywords":"什么的","ex":"Liệt kê mở đúng trật tự.","kind":"writing","id":"b6_054"},{"section":"w3","type":"open","stem":"A：生日会开始了吗？\nB：____（回答还没有，先等安妮）","model":"还没有，我们要先等安妮一会儿。","answer":"还没有，我们要先等安妮一会儿。","keywords":"等","ex":"Trả lời phù hợp hội thoại.","kind":"writing","id":"b6_055"},{"section":"w3","type":"open","stem":"A：你为什么这么高兴？\nB：____（因为今天过生日）","model":"因为今天是我的生日，所以我很高兴。","answer":"因为今天是我的生日，所以我很高兴。","keywords":"生日","ex":"Nêu lý do rõ, tự nhiên; có thể dùng 因为……所以…… từ Bài 4.","kind":"writing","id":"b6_056"},{"section":"w4","type":"open","stem":"写2–3句话，介绍你准备的一次生日会。至少使用“礼物”和“蛋糕”。","model":"明天是妹妹的生日。我准备了一个蛋糕，还给她买了一份礼物。朋友们也会来。","answer":"明天是妹妹的生日。我准备了一个蛋糕，还给她买了一份礼物。朋友们也会来。","keywords":"礼物|蛋糕","ex":"Đoạn ngắn có bối cảnh và hai từ bắt buộc.","kind":"writing","id":"b6_057"},{"section":"w4","type":"open","stem":"写2–3句话，介绍你的一项爱好，并使用“什么的”。","model":"我喜欢画画，也喜欢游泳。星期天我常常画画、听音乐什么的。","answer":"我喜欢画画，也喜欢游泳。星期天我常常画画、听音乐什么的。","keywords":"什么的","ex":"Miêu tả sở thích; liệt kê hoạt động cùng loại.","kind":"writing","id":"b6_058"},{"section":"w4","type":"open","stem":"你给朋友发一条生日消息（2–3句），请自然地使用“高高兴兴地”。","model":"祝你生日快乐！希望你今天高高兴兴地和家人一起吃饭、聊天。我们明天见！","answer":"祝你生日快乐！希望你今天高高兴兴地和家人一起吃饭、聊天。我们明天见！","keywords":"高高兴兴地","ex":"Chúc mừng và dùng trạng ngữ 地.","kind":"writing","id":"b6_059"},{"section":"w4","type":"open","stem":"写3句话，说说昨天你怎么庆祝一个生日。至少使用“先……再……”或“……以后……”，并提到一项活动。","model":"昨天是爷爷的生日。我们先一起吃饭，再给爷爷唱生日歌。吃完饭以后，大家一起聊天。","answer":"昨天是爷爷的生日。我们先一起吃饭，再给爷爷唱生日歌。吃完饭以后，大家一起聊天。","keywords":"先|再","ex":"Tái sử dụng mẫu trình tự thời gian và hoạt động.","kind":"writing","id":"b6_060"}],"tracks":[{"id":"L1","title":"给奶奶准备生日礼物 · Chuẩn bị quà cho bà","role":"对话","turns":[["小明","妈妈，星期日是奶奶的生日，我们送什么礼物好呢？"],["妈妈","奶奶喜欢画画，你可以给她买一盒彩笔。"],["小明","我还想做一张生日卡片，写上祝福。"],["妈妈","真好。奶奶也喜欢花，我们可以买一些花什么的。"],["小明","那我们星期六下午去商场吧。"],["妈妈","好。先把作业做完，我们再一起去。"]],"questions":["奶奶什么时候过生日？","奶奶喜欢做什么？","小明想自己做什么？","他们打算什么时候去商场？","去商场以前，小明要先做什么？"],"proof":["星期日是奶奶的生日。","奶奶喜欢画画。","我还想做一张生日卡片。","那我们星期六下午去商场吧。","先把作业做完，我们再一起去。"]},{"id":"L2","title":"家里的生日准备 · Chuẩn bị tiệc tại nhà","role":"对话","turns":[["爸爸","小雪，生日快乐！你先别进客厅。"],["小雪","为什么呀？你们在做什么？"],["爸爸","我们在准备一个小小的生日会。你等一会儿。"],["妈妈","好了！小雪，快进来吧！"],["小雪","哇，桌子上有蛋糕，还有鱼、面条什么的！"],["妈妈","今天你可以先打开礼物，再和大家一起吃饭。"],["小雪","谢谢你们！我很高兴。"]],"questions":["爸爸为什么先不让小雪进客厅？","妈妈什么时候让小雪进来？","桌子上除了蛋糕还有什么？","妈妈让小雪先做什么？","小雪最后心情怎么样？"],"proof":["我们在准备一个小小的生日会。","好了！小雪，快进来吧！","桌子上有蛋糕，还有鱼、面条什么的。","先打开礼物，再和大家一起吃饭。","我很高兴。"]},{"id":"L3","title":"朋友来过生日 · Bạn bè đến dự sinh nhật","role":"对话","turns":[["安妮","小雪，我到楼下了，你在家吗？"],["小雪","我在家！你上来吧，我们都在客厅等你。"],["安妮","好。我给你带了一本中文书。"],["小雪","谢谢！我的朋友们正在开开心心地唱歌呢。"],["安妮","我也想跟大家一起唱。"],["小雪","当然可以。唱完歌，我们再吃蛋糕。"]],"questions":["安妮现在在哪里？","安妮给小雪带了什么？","朋友们正在做什么？","他们打算唱歌以后做什么？"],"proof":["我到楼下了。","我给你带了一本中文书。","朋友们正在开开心心地唱歌。","唱完歌，我们再吃蛋糕。"]},{"id":"L4","title":"生日后的留言 · Lời nhắn sau sinh nhật","role":"独白","turns":[["小雪","昨天是我的生日。下午，朋友们来我家，我很开心。"],["小雪","妈妈做了面条，爸爸买了一个大蛋糕。"],["小雪","朋友送了我画笔和一本书。我先打开礼物，再跟大家一起画画。"],["小雪","晚上，大家高高兴兴地唱歌，十点以前就回家了。"]],"questions":["小雪的生日是哪一天？","爸爸给小雪买了什么？","小雪收到的礼物里有什么？","朋友们什么时候回家？"],"proof":["昨天是我的生日。","爸爸买了一个大蛋糕。","朋友送了我画笔和一本书。","十点以前就回家了。"]}],"readings":[{"id":"R1","name":"奶奶的生日 · Sinh nhật của bà","text":"星期日是奶奶的生日。奶奶今年七十岁了，她喜欢画画。小明和妈妈星期六下午去商场买了彩笔和花。星期日早上，小明先写好一张生日卡片，再把礼物送给奶奶。奶奶看了，笑着说：“谢谢你们！”"},{"id":"R2","name":"生日会上的消息 · Tin nhắn về tiệc sinh nhật","text":"安妮：我已经到你家楼下了。\n小雪：快上来吧！我们在客厅等你。\n安妮：我带了一本书给你。你们开始吃蛋糕了吗？\n小雪：还没有。我们先唱歌，再吃蛋糕。你进来以后就可以跟大家一起唱。"},{"id":"R3","name":"忙碌的一天 · Một ngày bận rộn","text":"昨天是刘老师的生日。上午她去学校上课，下午在家准备晚饭。朋友们带来了水果、花什么的。刘老师的房间干干净净的。晚上，大家高高兴兴地吃饭、聊天，九点半就回家了。"}],"photos":{}}</script><script>'use strict';
const DB=JSON.parse(document.getElementById('lesson-data').textContent);
const NAV=['01 · Luyện từ vựng','02 · Ngữ pháp & câu','03 · Nghe & đọc','04 · Luyện nói & viết'];
const SPEECH_PROMPT='你一般怎么过生日？你最想收到什么礼物？';
const PAGES=[
 {cn:'词语练习',vi:'Luyện từ vựng'},
 {cn:'语法与句子',vi:'Luyện ngữ pháp và tạo câu'},
 {cn:'听力与阅读',vi:'Nghe hiểu và đọc hiểu'},
 {cn:'口语与写作',vi:'Luyện nói và viết'}
];
const STORAGE='HSK2_BAI_6_OLIVE_60_CUMULATIVE_V1';
const CENTER_AI_ENDPOINT = ''; // vi du: 'https://ten-mien-cua-trung-tam.vn/api/hsk2-ai'
function hasCenterAI(){return /^https:\/\//i.test(CENTER_AI_ENDPOINT)||CENTER_AI_ENDPOINT.startsWith('/api/')}
async function centerAI(data){if(!hasCenterAI())throw Error('Chưa thể kết nối tính năng nhận xét.');const rsp=await fetch(CENTER_AI_ENDPOINT,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});const ret=await rsp.json().catch(()=>null);if(!rsp.ok)throw Error(ret?.error||('Máy chủ AI trả về lỗi '+rsp.status));if(!ret||typeof ret!=='object')throw Error('Máy chủ AI trả về dữ liệu không hợp lệ');return ret;}
const H=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm=s=>String(s??'').normalize('NFKC').replace(/[\s，。、：；！!？?,.\-；：]/g,'').trim().toLowerCase();
const Q=Object.fromEntries(DB.questions.map(q=>[q.id,q]));
const G=g=>DB.questions.filter(q=>q.section===g);
const sel=(g)=>G(g).map(q=>q.id);
let S={answers:{},grades:{},page:-1,order:{},tokenOrders:{},review:{},submittedAt:null};
try{const old=JSON.parse(localStorage.getItem(STORAGE)||'null');if(old&&typeof old==='object')S={...S,...old,answers:old.answers||{},grades:old.grades||{},order:old.order||{},tokenOrders:old.tokenOrders||{},review:old.review||{}}}catch(e){}
const save=()=>{try{localStorage.setItem(STORAGE,JSON.stringify(S))}catch(e){}};
let current=S.page>=0&&S.page<5?S.page:0;
let busy=false,audioObjectUrls={},audioElements={},speech=null;
const AUDIO_PATHS={L1:'assets/hsk2/bai6/nghe-1.mp3',L2:'assets/hsk2/bai6/nghe-2.mp3',L3:'assets/hsk2/bai6/nghe-3.mp3',L4:'assets/hsk2/bai6/nghe-4.mp3'};
function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function seedOf(str){let h=2166136261>>>0;for(let i=0;i<str.length;i++){h^=str.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0}
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return ((t^t>>>14)>>>0)/4294967296}}
function seededShuffle(arr,seed){arr=[...arr];const rand=mulberry32(seedOf(seed));for(let i=arr.length-1;i>0;i--){const j=Math.floor(rand()*(i+1));[arr[i],arr[j]]=[arr[j],arr[i]]}return arr}
function initializeOrders(){
 const needsReset=S.orderVersion!==2||!S.order||typeof S.order!=='object';
 if(needsReset)S.order={};
 const groups={};DB.questions.filter(q=>q.type==='mc').forEach(q=>(groups[q.section]??=[]).push(q));
 for(const [sec,items] of Object.entries(groups)){
  const ordered=seededShuffle(items,sec+'-questions');
  const positions=seededShuffle(ordered.map((_,i)=>i%3),sec+'-positions');
  ordered.forEach((q,i)=>{
   const others=seededShuffle(q.opts.map((_,j)=>j).filter(x=>x!==q.answer),q.id+'-others');
   const slot=positions[i]%q.opts.length;
   others.splice(slot,0,q.answer);
   S.order[q.id]=others;
  });
 }
 for(const q of DB.questions.filter(q=>q.type==='order'))if(!S.tokenOrders[q.id])S.tokenOrders[q.id]=seededShuffle(q.tokens.map((_,i)=>i),q.id+'-tokens');
 S.orderVersion=2;
 save();
}
initializeOrders();
function navRender(){
 document.getElementById('navbuttons').innerHTML=NAV.map((n,i)=>`<button class="navitem ${i===current?'active':''}" onclick="openPage(${i})" type="button">${H(n)}</button>`).join('');
 document.getElementById('tocLinks').innerHTML=NAV.map((n,i)=>`<button class="toc-link" onclick="openPage(${i})" type="button"><span>${H(n)}</span><span class="subtle" style="display:block">${H(PAGES[i].cn)}</span></button>`).join('');
 let done=DB.questions.filter(q=>answered(q)).length;document.getElementById('progress').style.width=(100*done/DB.questions.length).toFixed(1)+'%';
}
function answered(q){const a=S.answers[q.id];return q.type==='mc'?Number.isInteger(a):q.type==='order'?Array.isArray(a)&&a.length>0:!!String(a??'').trim()}
function showContents(){stopAudio();current=-1;S.page=-1;save();document.getElementById('view').innerHTML='';document.getElementById('tocPanel').hidden=false;document.getElementById('pageFoot').hidden=true;navRender();window.scrollTo({top:0,behavior:'instant'});}
function openPage(i){if(i<0||i>=4)return;stopAudio();current=i;S.page=i;save();document.getElementById('tocPanel').hidden=true;document.getElementById('pageFoot').hidden=false;
 const fn=[pageVocab,pageGrammar,pageListenRead,pageApply][i];document.getElementById('view').innerHTML=`<section class="page active"><div class="eyebrow">${String(i+1).padStart(2,'0')} / 04 · ${H(PAGES[i].cn)}</div><h2 class="page-title">${H(PAGES[i].vi)}</h2>${fn()}</section>`;
 document.getElementById('prev').disabled=i===0;document.getElementById('next').disabled=i===3;document.getElementById('footerLabel').textContent=`Chặng ${i+1}/4`;navRender();window.scrollTo({top:0,behavior:'instant'});
 if(i===2){for(const [id,url] of Object.entries(AUDIO_PATHS)){const a=document.getElementById('player-'+id);if(a){a.src=url;audioElements[id]=a;}}for(const [id,url] of Object.entries(audioObjectUrls)){const a=document.getElementById('player-'+id);if(a){a.src=url;audioElements[id]=a;}}}if(i===3){renderReport();renderMistakes()}
}
function navigate(d){openPage(current+d)}
function photo(key,caption=false){const p=DB.photos[key];return p?`<figure class="scene-card imgsmall"><img loading="lazy" src="${p.uri}" alt="${H(p.alt||key)}">${caption?`<figcaption class="subtle" style="padding:7px">${H(p.alt||'')}</figcaption>`:''}</figure>`:''}
function promptN(q){let id=DB.questions.indexOf(q)+1;return String(id).padStart(3,'0')}
function questionHTML(q){
 const a=S.answers[q.id],g=S.grades[q.id],graded=!!g;
 let body='';
 if(q.photo)body+=photo(q.photo);
 if(q.type==='mc'){
  const opts=S.order[q.id]||q.opts.map((_,i)=>i);
  body+=`<div class="choices">${opts.map((original,i)=>`<button type="button" aria-pressed="${a===original?'true':'false'}" class="choice ${a===original?'chosen':''} ${graded&&original===q.answer?'correct':''} ${graded&&a===original&&original!==q.answer?'incorrect':''}" onclick="choose('${q.id}',${original})">${'ABCDEF'[i]}. ${H(q.opts[original])}</button>`).join('')}</div>`;
 } else if(q.type==='fill'){
  body+=`<input class="hanzi-input" aria-label="Điền câu ${promptN(q)}" lang="zh-CN" value="${H(a??'')}" oninput="writeAnswer('${q.id}',this.value)" placeholder="请输入……">`;
 } else if(q.type==='order'){
  const chosen=Array.isArray(a)?a:[],order=S.tokenOrders[q.id]||q.tokens.map((_,i)=>i);
  body+=`<div class="assembled" lang="zh-CN">${chosen.map(i=>`<button class="token chosen" type="button" onclick="undoToken('${q.id}',${i})">${H(q.tokens[i])} ×</button>`).join('')||'<span class="subtle">点击词语，组成句子</span>'}</div><div class="tokens">${order.filter(i=>!chosen.includes(i)).map(i=>`<button class="token" onclick="pickToken('${q.id}',${i})" type="button">${H(q.tokens[i])}</button>`).join('')}</div><button type="button" class="btn light sm" onclick="clearOrder('${q.id}')">重排</button>`;
 } else {
  body+=`<textarea class="compose writing-input" aria-label="Viết câu ${promptN(q)}" id="answer-${q.id}" lang="zh-CN" placeholder="请用中文回答……" oninput="writeAnswer('${q.id}',this.value)">${H(a??'')}</textarea>`;
 }

let recorder=null,recordPieces=[],speechRecording=null,speechRecordingURL=null,speechBusy=false;
async function beginRecord(){
 const stat=document.getElementById('micStat');
 if(!navigator.mediaDevices?.getUserMedia||!window.MediaRecorder){if(stat)stat.textContent='Trình duyệt không hỗ trợ ghi âm.';return}

 try{
  const stream=await navigator.mediaDevices.getUserMedia({audio:true});

  const fb=document.getElementById('speechFeedback');if(fb){fb.textContent='';fb.className='ai-review-box';}
  recorder=new MediaRecorder(stream);
  recorder.ondataavailable=e=>{if(e.data.size)recordPieces.push(e.data)};
  recorder.onstop=()=>{
   speechRecording=new Blob(recordPieces,{type:recorder.mimeType||'audio/webm'});
   if(speechRecordingURL)URL.revokeObjectURL(speechRecordingURL);
   speechRecordingURL=URL.createObjectURL(speechRecording);
   const out=document.getElementById('micOut');if(out)out.innerHTML=`<audio controls src="${speechRecordingURL}"></audio>`;
   stream.getTracks().forEach(t=>t.stop());if(stat)stat.textContent='Đã ghi âm';

 }catch(e){if(stat)stat.textContent='Không mở được micro. Hãy cho phép truy cập micro hoặc mở trang bằng HTTPS.'}
}

function mergeAI(results,items,submitted){
 let done=0;const seen=new Set();
 for(const row of results){
  if(!row||typeof row.id!=='string'||seen.has(row.id))continue;seen.add(row.id);
  const q=items.find(x=>x.id===row.id);
  if(!q||typeof row.score!=='number'||!Number.isFinite(row.score)||row.score<0||row.score>1||typeof row.feedback!=='string'||!row.feedback.trim())continue;
  const answer=String(S.answers[q.id]||'').trim();
  if(!answer||answer!==submitted[q.id])continue;
  S.grades[q.id]={score:row.score,mode:'ai',feedback:row.feedback,rewrite:String(row.rewrite||'')};done++;
 }
 return done;
}
async function gradeWrittenGroup(sec){let qs=G(sec).filter(q=>q.type==='open'&&String(S.answers[q.id]||'').trim()&&S.grades[q.id]?.mode!=='ai');if(!qs.length){alert('Chưa có câu mới cần AI chấm trong vòng này.');return;}if(!hasCenterAI()){alert('Hiện chưa thể chấm tự luận bằng AI. Bạn có thể thử lại sau.');return}if(busy)return;busy=true;try{const submitted=Object.fromEntries(qs.map(q=>[q.id,String(S.answers[q.id]||'').trim()]));const results=await callAI(qs);const done=mergeAI(results,qs,submitted);save();qs.forEach(q=>replaceQ(q.id));alert('AI 小语 đã chấm '+done+'/'+qs.length+' câu.')}catch(e){alert('Chưa chấm AI được: '+e.message)}finally{busy=false}}
async function gradeAll(){if(busy)return;busy=true;let btn=document.getElementById('globalGrade'),status=document.getElementById('gradeStatus');if(btn)btn.disabled=true;if(status)status.textContent=`Đang chấm ${DB.questions.filter(q=>q.type!=='open').length} câu khách quan…`;
 for(const q of DB.questions){S.grades[q.id]=q.type==='open'?(S.grades[q.id]?.mode==='ai'?S.grades[q.id]:writingRule(q)):objective(q)}
 let need=DB.questions.filter(q=>q.type==='open'&&String(S.answers[q.id]||'').trim()&&S.grades[q.id]?.mode!=='ai');let msg='Đã chấm 44 câu khách quan. Câu viết có nội dung còn chờ AI; câu bỏ trống tính 0 điểm.';
 if(need.length&&hasCenterAI()){try{if(status)status.textContent='Đang chấm bài tự luận với AI trung tâm…';const submitted=Object.fromEntries(need.map(q=>[q.id,String(S.answers[q.id]||'').trim()]));const results=await callAI(need);const n=mergeAI(results,need,submitted);msg=n===need.length?`AI đã chấm ${n} câu được gửi.`:`AI đã chấm ${n}/${need.length} câu được gửi. Câu còn lại chưa chấm AI.`}catch(e){msg='Chưa thể chấm tự luận bằng AI: '+e.message}}
 else if(!need.length)msg='Đã chấm 44 câu khách quan; các câu viết đã có điểm AI hoặc được xác nhận bỏ trống (0 điểm).';
 S.submittedAt=Date.now();save();busy=false;openPage(3);const st=document.getElementById('gradeStatus');if(st)st.textContent=msg;document.getElementById('resultLabel')?.scrollIntoView({behavior:'smooth',block:'center'});
}
