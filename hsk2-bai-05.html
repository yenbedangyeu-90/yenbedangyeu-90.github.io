/* V7: picture-based production tasks */
.scene-card{display:block;background:#f8f8ee;border:1px solid var(--line);border-radius:14px;overflow:hidden;margin:10px 0 15px;max-width:100%}

.q>.scene-card{max-width:510px}
.pic-gallery{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:15px}
.picwriting{padding:15px;border:1px solid var(--line);border-radius:16px;background:white;display:flex;flex-direction:column;gap:7px}
.picwriting h4{margin:0;font-size:17px;color:var(--wine)}
.picwriting .scene-card{margin:0}
.picwriting .compose{min-height:90px}
.v7-keywords{font-size:14px;background:#ece9cb;padding:7px 9px;border-radius:8px}
.v7-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.matchgrid{display:grid;grid-template-columns:1fr 2fr;gap:14px}

.matchchoices button{padding:10px;border:1px solid var(--line);background:#fff;border-radius:10px;text-align:left;color:var(--ink)}
.matchchoices button.selected{border-color:var(--wine);background:#fae9e5}
.matchchoices button.assigned{background:#f0f8f2;border-color:#9bc4aa}
.seq-gallery{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}

.seq-gallery img{width:100%;display:block;aspect-ratio:600/340;object-fit:cover;border-radius:8px}
.seq-num{position:absolute;left:8px;top:8px;background:var(--wine);color:#fff;border-radius:50%;width:27px;height:27px;display:grid;place-items:center;font-size:12px;font-weight:800}
.pic-count{font-size:12px;color:var(--muted)}

[hidden]{display:none!important}.choice{overflow-wrap:anywhere}.qtitle strong{white-space:pre-wrap}
.table-wrap{max-width:100%;overflow:auto}.table-wrap table{border-collapse:collapse;width:100%;min-width:490px}.table-wrap td,.table-wrap th{border:1px solid var(--line);padding:10px;text-align:left}.table-wrap th{background:#fff0e8;color:var(--wine)}
.imgsmall{max-width:550px}.ai-inline{font-size:13px;color:var(--muted)}.footer button{min-height:41px}

":"我在楼上，朋友在楼下等我，我马上____。","opts":["上来","进来","下去"],"answer":2,"ex":"下去: xuống, rời vị trí người nói.","kind":"vocab","id":"b5_008"},{"section":"v1","type":"mc","stem":"朋友在门外，主人说：“快____坐吧！”","opts":["进来","上去","过去"],"answer":0,"ex":"进来: mời đi vào.","kind":"vocab","id":"b5_009"},{"section":"v2","type":"mc","stem":"你在一楼，朋友在三楼对你说“快上来”。你应该怎么做？","opts":["从三楼下到一楼。","站在一楼等。","从一楼走到三楼。"],"answer":2,"ex":"Hiểu nghĩa và lựa chọn lời đáp phù hợp tình huống.","kind":"vocab","id":"b5_017"},{"section":"v2","type":"mc","stem":"小林在二楼，安妮在一楼。小林说“我马上下去”。说明小林要：","opts":["走到一楼。","走到四楼。","进教室坐下。"],"answer":0,"ex":"Hiểu nghĩa và lựa chọn lời đáp phù hợp tình huống.","kind":"vocab","id":"b5_018"},{"section":"v2","type":"mc","stem":"客人带了很多礼物，主人最自然的回答是：","opts":["你们太客气了！","你为什么迟到了？","现在几楼了？"],"answer":0,"ex":"Hiểu nghĩa và lựa chọn lời đáp phù hợp tình huống.","kind":"vocab","id":"b5_021"},{"section":"v2","type":"mc","stem":"家月说“十一点前到就可以”。哪项正确？","opts":["10:50 到不迟。","11:30 到也不迟。","必须 9:00 前到。"],"answer":0,"ex":"Hiểu nghĩa và lựa chọn lời đáp phù hợp tình huống.","kind":"vocab","id":"b5_024"},{"section":"v2","type":"mc","stem":"“都十二点了”一般强调：","opts":["时间已经很晚或到点了。","还不到十点。","不知道几点。"],"answer":0,"ex":"Hiểu nghĩa và lựa chọn lời đáp phù hợp tình huống.","kind":"vocab","id":"b5_030"},{"section":"v2","type":"mc","stem":"客人要把礼物给朋友，最合适说法是：","opts":["这是在下面等你。","这是送给你的礼物。","这是喝过的酒店。"],"answer":1,"ex":"Hiểu nghĩa và lựa chọn lời đáp phù hợp tình huống.","kind":"vocab","id":"b5_031"},{"section":"v2","type":"mc","stem":"客人问“你准备了什么？”最合适回答是：","opts":["准备过去上来。","准备了几个颜色。","准备了一些水果和奶茶。"],"answer":2,"ex":"Hiểu nghĩa và lựa chọn lời đáp phù hợp tình huống.","kind":"vocab","id":"b5_032"},{"section":"v3","type":"fill","stem":"请____我一会儿，我马上来。","answer":"等","ex":"","kind":"vocab","id":"b5_036"},{"section":"v3","type":"fill","stem":"客人来了，妈妈已经____好晚饭了。","answer":"准备","ex":"","kind":"vocab","id":"b5_038"},{"section":"v3","type":"fill","stem":"白家月带了很多____去朋友家。","answer":"礼物","ex":"","kind":"vocab","id":"b5_039"},{"section":"v3","type":"fill","stem":"孩子们的爸爸的爸爸是他们的____。","answer":"爷爷","ex":"","kind":"vocab","id":"b5_040"},{"section":"v3","type":"fill","stem":"爷爷买来一杯____，很好喝。","answer":"奶茶","ex":"","kind":"vocab","id":"b5_041"},{"section":"v3","type":"fill","stem":"因为酒店不远，所以我们____回去了。","answer":"走","ex":"","kind":"vocab","id":"b5_042"},{"section":"v4","type":"mc","stem":"安妮在酒店楼下，白家月在楼上。谁应该“下来”？","opts":["安妮。","白家月。","王一雪。"],"answer":1,"ex":"Suy luận dựa trên tình huống giao tiếp thực tế.","kind":"vocab","id":"b5_043"},{"section":"v4","type":"mc","stem":"奶奶看到客人拿来四份礼物，说“太客气了”，表示：","opts":["觉得客人很粗心。","让客人马上出去。","感谢且认为客人太周到了。"],"answer":2,"ex":"Suy luận dựa trên tình huống giao tiếp thực tế.","kind":"vocab","id":"b5_044"},{"section":"v4","type":"mc","stem":"大家已经吃完饭，又想到商场喝奶茶。最自然的说法是：","opts":["吃完饭，我们一起走过去看看。","奶茶走完以后吃商场。","进来酒店的奶茶。"],"answer":0,"ex":"Suy luận dựa trên tình huống giao tiếp thực tế.","kind":"vocab","id":"b5_045"},{"section":"v4","type":"mc","stem":"老师在教室里，学生在走廊。老师要让学生进来，应说：","opts":["快出去吧。","快进来吧。","快过去楼下吧。"],"answer":1,"ex":"Suy luận dựa trên tình huống giao tiếp thực tế.","kind":"vocab","id":"b5_046"},{"section":"v4","type":"mc","stem":"“都十一点了，你还不走？”暗示：","opts":["现在才八点。","说话人不知道时间。","说话人觉得应该走了。"],"answer":2,"ex":"Suy luận dựa trên tình huống giao tiếp thực tế.","kind":"vocab","id":"b5_047"},{"section":"v4","type":"mc","stem":"去朋友家之前，最合适先做的事是：","opts":["准备礼物并确认到达时间。","要求主人来酒店买车票。","一直等到半夜。"],"answer":0,"ex":"Suy luận dựa trên tình huống giao tiếp thực tế.","kind":"vocab","id":"b5_048"},{"section":"g1","type":"mc","stem":"小王站在一楼，要上三楼找老师。他说：“我现在____。”","opts":["上去","上来","下来"],"answer":0,"ex":"去: di chuyển xa người đang ở tầng dưới.","kind":"grammar","id":"b5_051"},{"section":"g1","type":"mc","stem":"我在三楼，朋友在一楼叫我。我说：“我马上____。”","opts":["下来","下去","进去"],"answer":1,"ex":"去: từ vị trí hiện tại xuống dưới.","kind":"grammar","id":"b5_052"},{"section":"g1","type":"mc","stem":"我站在楼下，老师在二楼，让我____。","opts":["上去","下去","出来"],"answer":0,"ex":"Góc nhìn của người nói ở dưới: 上去.","kind":"grammar","id":"b5_054"},{"section":"g1","type":"mc","stem":"哪句语序符合“动词+方向+来”？","opts":["请来进走。","请走进来。","请进走来。"],"answer":1,"ex":"走进来: đi vào.","kind":"grammar","id":"b5_055"},{"section":"g1","type":"mc","stem":"哪句话表达“去楼下开门”（说话人在楼上）？","opts":["我上来开门。","我下来楼上。","我下去开门。"],"answer":2,"ex":"下去 chỉ đi xuống từ vị trí người nói.","kind":"grammar","id":"b5_056"},{"section":"g1","type":"mc","stem":"“朋友给我拿来了一本书”中的“来”表示：","opts":["书向说话人这边移动。","书离说话人更远。","书在商场里没有动。"],"answer":0,"ex":"拿来: mang tới phía người nói.","kind":"grammar","id":"b5_057"},{"section":"g1","type":"mc","stem":"哪句“宾语是地点”的语序自然？","opts":["他跑进来了房间。","他跑进房间来了。","他跑房间进来。"],"answer":1,"ex":"Địa điểm đặt trước 来/去 trong kết cấu bổ ngữ hướng.","kind":"grammar","id":"b5_058"},{"section":"g1","type":"mc","stem":"“都十二点了，我们吃饭吧。” 的意思是：","opts":["刚七点，不能吃饭。","还没有到中午。","已经十二点了，应该吃饭。"],"answer":2,"ex":"都……了 nhấn mạnh đã đến thời điểm.","kind":"grammar","id":"b5_059"},{"section":"g1","type":"mc","stem":"“都八点半了，你还不起床？”说明说话人：","opts":["觉得起床太晚了。","很希望他继续睡觉。","不知道现在几点。"],"answer":0,"ex":"都……了 mang sắc thái thúc giục.","kind":"grammar","id":"b5_060"},{"section":"g1","type":"mc","stem":"下面哪句用“都……了”正确？","opts":["九点都走快了。","都九点了，快走吧。","都了九点，我们走。"],"answer":1,"ex":"都 + mốc/ trạng thái + 了.","kind":"grammar","id":"b5_061"},{"section":"g1","type":"mc","stem":"已经到达十一点，担心要迟到，可以说：","opts":["我都十一点酒店上来。","了十一点都走进来。","都十一点了，快点儿吧！"],"answer":2,"ex":"Dùng 都……了 để nhấn mạnh muộn.","kind":"grammar","id":"b5_062"},{"section":"g1","type":"mc","stem":"“我都吃过饭了”表示：","opts":["我已经吃过饭了。","我还没吃饭。","我正准备做饭。"],"answer":0,"ex":"都……了 + 过: đã có trải nghiệm/hoàn thành.","kind":"grammar","id":"b5_063"},{"section":"g1","type":"mc","stem":"“都快十一点了” 的语气接近：","opts":["现在才早上六点。","时间不早了。","明天一定十一点。"],"answer":1,"ex":"都快…了 báo gần đến mốc.","kind":"grammar","id":"b5_064"},{"section":"g1","type":"mc","stem":"客人带来了一些水果，哪句自然？","opts":["你们来礼物带这么多！","你们多礼物还带来这！","你们还带这么多礼物来！"],"answer":2,"ex":"Danh từ đồ vật có thể đứng trước 来.","kind":"grammar","id":"b5_065"},{"section":"g1","t {"id":"L2","title":"第一次进朋友家 · Lần đầu đến thăm nhà","role":"对话","turns":[["王一雪","家月、安妮，欢迎你们！快进来，外面有点儿冷。"],["白家月","一雪姐，你好！谢谢你请我们来。我还带了一些礼物。"],["王一雪","你们太客气了！我先给你们介绍一下家里人。"],["王一雪","这是孩子们的爷爷和奶奶。他们今天都在家。"],["安妮","爷爷、奶奶，你们好！很高兴见到你们。"],["刘爷爷","你们好！第一次来我们家吧？坐下喝点儿茶。"],["白家月","这是我们给您和奶奶准备的水果，这是给孩子们的书。"],["刘奶奶","谢谢！你们别客气，饭已经准备好了，一会儿就吃。"]],"questions":["王一雪在门口对朋友说了什么？","王一雪介绍的两位老人是谁？","白家月给孩子们带了什么？","奶奶说饭怎么样了？"],"proof":["欢迎你们！快进来。","这是孩子们的爷爷和奶奶。","这是给孩子们的书。","饭已经准备好了。"]},{"id":"L3","title":"午饭和奶茶 · Bữa trưa và trà sữa","role":"对话","turns":[["王一雪","都十二点了，大家先洗手，我们吃饭吧。"],["安妮","一雪姐，桌子上有这么多好吃的菜，都是你自己做的吗？"],["王一雪","对，都是我今天早上做的。你们多吃点儿。"],["白家月","谢谢！这杯奶茶也很好喝，是你自己做的吗？"],["王一雪","不是，奶茶是爷爷在前面的商场买的。"],["刘爷爷","我以前常常在那家商场买奶茶，今天也买了四杯。"],["安妮","我没喝过这么好喝的奶茶。商场离你们家远吗？"],["王一雪","不远，吃完饭你们可以跟我一起走过去看看。"]],"questions":["大家几点开始准备吃饭？","桌上的菜是谁做的？","奶茶是谁买的？","饭后他们可以一起去哪儿？"],"proof":["都十二点了，大家先洗手。","都是我今天早上做的。","奶茶是爷爷在前面的商场买的。","吃完饭你们可以跟我一起走过去。"]},{"id":"L4","title":"白家月的留言 · Lời nhắn sau buổi thăm","role":"独白","turns":[["白家月","李文，你好！昨天我和安妮第一次去中国朋友王一雪家，今天想告诉你一些有意思的事。"],["白家月","上午十点半，我们从酒店出发。到了她家门口，她说“快进来”，还介绍了孩子们的爷爷和奶奶。"],["白家月","我们给他们准备了水果和书。爷爷奶奶很高兴，一直说我们太客气了。"],["白家月","中午十二点，一雪说“都十二点了，吃饭吧！”她自己做了很多菜，大家一起吃得很高兴。"],["白家月","爷爷给我们买来了奶茶。我以前喝过奶茶，但没喝过这么好喝的。"],["白家月","饭后我们跟一雪一起走去附近的商场。因为吃得太多，所以晚上没再坐车，和安妮走回酒店。"]],"questions":["白家月和安妮什么时候去朋友家？","她们给朋友家带了什么？","刘爷爷带来了什么饮料？","她们为什么走回酒店？"],"proof":["昨天我和安妮第一次去。","准备了水果和书。","爷爷给我们买来了奶茶。","因为吃得太多，所以……走回酒店。"]}],"readings":[{"id":"R1","name":"第一次登门 · Đến nhà bạn lần đầu","text":"星期六上午，安妮和白家月要去王一雪家。她们住在酒店，朋友家离酒店不太远。安妮十点二十分就到楼下了，可是白家月还在楼上准备礼物。安妮打电话说：“都十点二十分了，你快下来吧！”白家月说：“好，我一会儿就下去。”十点半，两个人一起走到朋友家。十一点以前，她们就到了。","questions":["安妮先在哪里等白家月？","白家月为什么还在楼上？","两个人几点一起出发？","两个人什么时候到了朋友家？"]},{"id":"R2","name":"家人的欢迎 · Cả nhà đón khách","text":"王一雪打开门说：“你们快进来吧！”这是白家月和安妮第一次来她家。家里有孩子们的爷爷、奶奶，还有两个小朋友。白家月把买来的水果送给爷爷奶奶，把书送给孩子们。爷爷高兴地说：“你们太客气了！”奶奶请客人坐下喝茶，一雪把大家介绍给了两位朋友。","questions":["开门欢迎朋友的人是谁？","这是两位客人第几次到王一雪家？","白家月送给孩子们什么？","谁说“你们太客气了”？"]},{"id":"R3","name":"十二点吃饭 · Ăn trưa lúc mười hai giờ","text":"中午十二点，王一雪说：“都十二点了，我们吃饭吧！”桌上有米饭、鱼、鸡蛋和青菜，都是一雪自己准备的。安妮觉得菜很好吃，就问奶茶是不是一雪做的。一雪说：“不是，奶茶是爷爷在商场买来的。”吃完饭，大家先休息了一会儿，然后一起走去附近的商场。","questions":["大家什么时候开始吃饭？","桌上的菜是谁准备的？","奶茶从哪里买来？","吃完饭后大家做了什么？"]},{"id":"R4","name":"给朋友的消息 · Tin nhắn gửi bạn","text":"李文：昨天我和安妮第一次去一位中国朋友家。我们准备了水果和一本中文书，到她家的时候，爷爷奶奶都在。大家一起吃午饭，奶茶也很好喝。饭后，我跟朋友去商场看了看。商场不远，只有十分钟的路。晚上我和安妮走回酒店。因为中午吃得太多，所以我们晚上只喝了一点儿水。下次你也跟我们一起去吧！——白家月","questions":["白家月把消息发给谁？","他们在朋友家喝了什么？","商场离朋友家有多远？","他们晚上为什么只喝水？"]}],"table":{"columns":["时间","安排","地点","备注"],"rows":[["10:20","在楼下等朋友","酒店一楼","安妮先到"],["10:30","一起出发","酒店门口","步行"],["10:50","到朋友家","王一雪家","进屋见爷爷奶奶"],["12:00","一起吃午饭","王一雪家","奶茶是爷爷买的"],["13:30","去商场看看","附近商场","走路十分钟"]]},"photos":{"welcome":{"uri":"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAYEBAUEBAYFBQUGBgYHCQ4JCQgICRINDQoOFRIWFhUSFBQXGiEcFxgfGRQUHScdHyIjJSUlFhwpLCgkKyEkJST/2wBDAQYGBgkICREJCREkGBQYJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCT/wAARCAM5BEwDASIAAhEBAxEB/8QAHAAAAQUBAQEAAAAAAAAAAAAAAwECBAUGBwAI/8QAURAAAQMCBAMFBQMIBgkCBgIDAQACAwQRBRIhMQZBUQcTImFxFDJygbEjQpEVJDM0UmKhwSUmNXOy0RY2Q1NjgqLh8GSSCER0o8LxF1SDJ7P/xAAaAQACAwEBAAAAAAAAAAAAAAABAgADBAUG/8QANREAAgIBAwMDBAEDAwQCAwAAAAECEQMSITEEMkETIlEFM2FxgRQjQlKx8EORweGh0RU0Yv/aAAwDAQACEQMRAD8AKH2dpZK8Od4rDw8kIEEaXRbgjXTqoOCc1+Zpbp1CVrLE5zcopLjawCe4AgeEFQgEtAtbU+aUNIbbnvZONg4Ea6JQzxa6g8kCAGNudtRqnmLbL80QWzu5AdOYT3DUagEKEAtLuR8gni2pduvZbkusdDdKRmN+R3RIDNuX4ItK0mVpvfWyY6MCzQdkemY7vW9SRZFEZbOJ7p5sAQOaqxJmFgNB97qrKYh8UrXe9Y7KszENtZPMSATUA2tYoYF99F5psRmOpRCCN9dNkhYMy+IC7NNyneDdvNesDbMAvZm5zbQjfooQTw6kDRDcM9kRx+7/ABTdwORChBrW2t18kS5GvO9rpWtzEbWslNyPDuOihBCbuJB20SgW0JBA6HVNtmOgJda5RY4wQdN/4IgPPuQNPO6WN+Um4PlZej+0Hdk6A8xqisIEuVoI5WUCeLg6KzRfndLmzFrRq4A/PRMddh8I/BMa97JA1zS4WO2+ygDFvOSV19SSUKQDNdw5I0zfG4WNgSUCXxAnb+apLWVGPD+jX6G/exqmB0V3juuFuve/ex/zVKAtWPgyZeT1rqv4nF8Oox+9J/JWIVfxMPzCi+KT+SaXDEjyhsTfsI/hCmYgLVbvhb/hCjxD7FnoFIxT9dd8Lf8ACFJ8BhyRt0oCQFOVRaOCVICvFQh4pCvEpLqEPAaqHxYbmO/kpzd1A4t0yKnLzEux9sjoHZ87JhTj5/8A4rC9ozs3FNYf/UP+q3PAA/oh3r/+ function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function seedOf(str){let h=2166136261>>>0;for(let i=0;i<str.length;i++){h^=str.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0}
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return ((t^t>>>14)>>>0)/4294967296}}
function seededShuffle(arr,seed){arr=[...arr];const rand=mulberry32(seedOf(seed));for(let i=arr.length-1;i>0;i--){const j=Math.floor(rand()*(i+1));[arr[i],arr[j]]=[arr[j],arr[i]]}return arr}
function initializeOrders(){
 const needsReset=S.orderVersion!==2||!S.order||typeof S.order!=='object';
 if(needsReset)S.order={};
 const groups={};DB.questions.filter(q=>q.type==='mc').forEach(q=>(groups[q.section]??=[]).push(q));
 for(const [sec,items] of Object.entries(groups)){
  const ordered=seededShuffle(items,sec+'-questions');
  const positions=seededShuffle(ordered.map((_,i)=>i%3),sec+'-positions');
  ordered.forEach((q,i)=>{
   const others=seededShuffle(q.opts.map((_,j)=>j).filter(x=>x!==q.answer),q.id+'-others');
   const slot=positions[i]%q.opts.length;
   others.splice(slot,0,q.answer);
   S.order[q.id]=others;
  });
 }
 for(const q of DB.questions.filter(q=>q.type==='order'))if(!S.tokenOrders[q.id])S.tokenOrders[q.id]=seededShuffle(q.tokens.map((_,i)=>i),q.id+'-tokens');
 S.orderVersion=2;
 save();
}

let recorder=null,recordPieces=[],speechRecording=null,speechRecordingURL=null,speechBusy=false;
async function beginRecord(){

  recorder=new MediaRecorder(stream);
  recorder.ondataavailable=e=>{if(e.data.size)recordPieces.push(e.data)};
  recorder.onstop=()=>{
   speechRecording=new Blob(recordPieces,{type:recorder.mimeType||'audio/webm'});
   if(speechRecordingURL)URL.revokeObjectURL(speechRecordingURL);
   speechRecordingURL=URL.createObjectURL(speechRecording);
   const out=document.getElementById('micOut');if(out)out.innerHTML=`<audio controls src="${speechRecordingURL}"></audio>`;
   stream.getTracks().forEach(t=>t.stop());if(stat)stat.textContent='Đã ghi âm';

  recorder.start();if(stat)stat.textContent='Đang ghi âm';
 }catch(e){if(stat)stat.textContent='Không mở được micro. Hãy cho phép truy cập micro hoặc mở trang bằng HTTPS.'}
}

function renderReport(){let b=document.getElementById('reportBox');if(!b)return;
 const specs=[['Từ vựng',['v1','v2','v3','v4']],['Ngữ pháp',['g1','g2']],['Nghe hiểu',['l1']],['Đọc hiểu',['r1','r2']],['Giao tiếp / Viết AI',['w1','w2','w3','w4']]];
 b.innerHTML=`<div class="summary-pieces">${specs.map(([title,groups])=>{const qs=DB.questions.filter(q=>groups.includes(q.section)),real=qs.filter(q=>S.grades[q.id]&&S.grades[q.id].mode!=='pending'),pending=qs.filter(q=>S.grades[q.id]?.mode==='pending'),v=real.reduce((n,q)=>n+S.grades[q.id].score,0);return `<div class="skillbox"><div class="subtle">${title}</div><div class="value">${real.length?Math.round(100*v/real.length)+'%':pending.length?'Chờ AI':'—'}</div><div class="tiny">${real.length}/${qs.length} đã chấm${pending.length?' · '+pending.length+' chờ AI':''}</div></div>`}).join('')}</div>`;
 const d=getCounts(),done=d.graded===DB.questions.length,lb=document.getElementById('resultLabel'),num=document.getElementById('resultNumber'),split=document.getElementById('gradeSplit');
 if(lb)lb.textContent=done?(d.rule?'ĐIỂM TẠM TÍNH · phần tự luận còn chờ AI':'Điểm tổng hợp đã chấm'):'Đã trả lời '+d.answered+'/'+DB.questions.length+' mục';
 if(num)num.textContent=done?(10*d.score/DB.questions.length).toFixed(2):'—';
 if(split)split.innerHTML=done?`<div class="subtle">Khách quan: ${d.O.reduce((s,q)=>s+(S.grades[q.id]?.score||0),0).toFixed(0)}/${d.O.length} · Tự luận AI đã chấm ${d.W.filter(q=>S.grades[q.id]?.mode==='ai').length}/${d.W.length} · điểm phần viết đã xác nhận ${d.W.reduce((s,q)=>s+(S.grades[q.id]?.mode==='ai'?S.grades[q.id].score:0),0).toFixed(1)}/${d.W.length}</div>`:'';
 renderReviewWords();}
function renderMistakes(){let b=document.getElementById('mistakeBox');if(!b)return;const wrong=DB.questions.filter(q=>S.grades[q.id]&&S.grades[q.id].score<.6&&(q.type!=='open'||S.grades[q.id].mode==='ai'));
 b.innerHTML=wrong.length?wrong.slice(0,50).map(q=>`<div class="list-error"><div class="subtle">${H(q.id)}</div><b lang="zh-CN">${H(q.stem)}</b><div>${H(S.grades[q.id].feedback||'')}</div><div class="subtle" lang="zh-CN">${H(q.model||q.opts?.[q.answer]||q.answer)}</div></div>`).join(''):'<p class="subtle">Chưa có câu cần sửa.</p>'}
function renderReviewWords(){let b=document.getElementById('reviewWords');if(!b)return;const now=Date.now();const weak=new Set(DB.questions.filter(q=>q.target&&S.grades[q.id]?.mode==='automatic'&&S.grades[q.id].score===0).map(q=>q.target));let pending=DB.vocab.map((v,i)=>({v,i,r:S.review[i]})).filter(x=>!x.r||x.r.due<=now);pending.sort((a,b)=>Number(weak.has(b.v.hanzi))-Number(weak.has(a.v.hanzi)));b.innerHTML=pending.length?pending.map(x=>`<div class="rating"><span lang="zh-CN"><strong>${H(x.v.hanzi)}</strong>${weak.has(x.v.hanzi)?' <span class="subtle">· cần ôn thêm</span>':''} <span class="subtle">${H(x.v.meaning)}</span></span><div class="actions" style="margin:0"><button class="btn light sm" onclick="reviewWord(${x.i},false)">Chưa nhớ</button><button class="btn sm" onclick="reviewWord(${x.i},true)">Đã nhớ</button></div></div>`).join(''):'<p class="subtle">Đã hoàn thành phần ôn hôm nay.</p>'}
function reviewWord(i,ok){let prev=S.review[i]?.level||0,level=ok?Math.min(prev+1,3):0;S.review[i]={level,due:Date.now()+[1,1,3,7][level]*86400000};save();renderReviewWords()}
async function callAI(items){
 const data=await centerAI({action:'grade_writing',level:'HSK1–HSK2 Bài 5',items:items.map(q=>({id:q.id,prompt:q.stem,reference:q.model||'',student:String(S.answers[q.id]||''),criteria:'Rubric 0–10: đúng yêu cầu 0–4; ngữ pháp 0–3; từ vựng 0–2; tự nhiên 0–1. '+(q.ex||'')+(q.scene?' Ảnh được mô tả: '+q.scene:''),keywords:q.keywords||''}))});
 if(!Array.isArray(data.results))throw Error('AI trả về sai định dạng danh sách bài viết');
 return data.results;
}
function mergeAI(results,items){let done=0;for(const row of results){const q=items.find(x=>x.id===row.id);if(!q||typeof row.score!=='number'||!Number.isFinite(row.score)||row.score<0||row.score>1||typeof row.feedback!=='string'||!row.feedback.trim())continue;if(!String(S.answers[q.id]||'').trim())continue;S.grades[q.id]={score:row.score,mode:'ai',feedback:row.feedback,rewrite:String(row.rewrite||'')};done++;}return done;}
async function gradeWrittenGroup(sec){let qs=G(sec).filter(q=>q.type==='open'&&String(S.answers[q.id]||'').trim()&&S.grades[q.id]?.mode!=='ai');if(!qs.length){alert('Chưa có câu mới cần AI chấm trong vòng này.');return;}if(!hasCenterAI()){alert('Hiện chưa thể chấm tự luận bằng AI. Bạn có thể thử lại sau.');return}if(busy)return;busy=true;try{const results=await callAI(qs);const done=mergeAI(results,qs);save();qs.forEach(q=>replaceQ(q.id));alert('AI 小语 đã chấm '+done+'/'+qs.length+' câu.')}catch(e){alert('Chưa chấm AI được: '+e.message)}finally{busy=false}}
async function gradeAll(){if(busy)return;busy=true;let btn=document.getElementById('globalGrade'),status=document.getElementById('gradeStatus');if(btn)btn.disabled=true;if(status)status.textContent=`Đang chấm ${DB.questions.filter(q=>q.type!=='open').length} câu khách quan…`;
 for(const q of DB.questions){S.grades[q.id]=q.type==='open'?(S.grades[q.id]?.mode==='ai'?S.grades[q.id]:writingRule(q)):objective(q)}
 let need=DB.questions.filter(q=>q.type==='open'&&String(S.answers[q.id]||'').trim()&&S.grades[q.id]?.mode!=='ai');let msg='Đã chấm 84 câu khách quan. Phần viết đang chờ nhận xét AI.';
 if(need.length&&hasCenterAI()){try{if(status)status.textContent='Đang chấm bài tự luận với AI trung tâm…';const results=await callAI(need);const n=mergeAI(results,need);msg=n===need.length?`AI đã chấm ${n} câu được gửi.`:`AI đã chấm ${n}/${need.length} câu được gửi. Câu còn lại chưa chấm AI.`}catch(e){msg='Chưa thể chấm tự luận bằng AI: '+e.message}}
 else if(!need.length)msg='Đã chấm khách quan; các câu viết đã chấm AI hoặc chưa được trả lời.';
 S.submittedAt=Date.now();save();busy=false;openPage(3);const st=document.getElementById('gradeStatus');if(st)st.textContent=msg;document.getElementById('resultLabel')?.scrollIntoView({behavior:'smooth',block:'center'});
}
function downloadProgress(){let d={lesson:'HSK2-B5',total:DB.questions.length,submittedAt:S.submittedAt,answers:S.answers,grades:S.grades};const blob=new Blob([JSON.stringify(d,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='HSK2_Bai5_100Cau_Ket_qua.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1200)}
function resetAll(){if(!confirm('Xóa tiến độ và làm lại?'))return;localStorage.removeItem(STORAGE);S={answers:{},grades:{},page:0,order:{},tokenOrders:{},review:{},submittedAt:null};initializeOrders();openPage(0)}
openPage(current);
</script></body></html>
