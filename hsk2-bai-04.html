/* V7: picture-based production tasks */

.v7-keywords{font-size:14px;background:#ece9cb;padding:7px 9px;border-radius:8px}
.v7-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}

.matchchoices button{padding:10px;border:1px solid var(--line);background:#fff;border-radius:10px;text-align:left;color:var(--ink)}

.pic-count{font-size:12px;color:var(--muted)}

hơn.","kind":"vocab","target":"更"},{"id":"b4_005","section":"v1","type":"mc","stem":"这个书包有三种____：红、绿、黑。","opts":["裤子","颜色","书包"],"answer":1,"ex":"颜色 = màu sắc.","kind":"vocab","target":"颜色"},{"id":"b4_006","section":"v2","type":"mc","stem":"朋友问：“你去过这家商场吗？”你从来没去，怎么说？","opts":["我没去过。","我不去过。","我正在去过。"],"answer":0,"ex":"Trải nghiệm phủ định: 没(有)+动词+过。","kind":"vocab"},{"id":"b4_007","section":"v2","type":"mc","stem":"哪个句子表示“以前试过衣服”？","opts":["我在试过呢。","我马上想试过。","我试过红色的。"],"answer":2,"ex":"试过 + đồ: đã từng thử.","kind":"vocab"},{"id":"b4_008","section":"v2","type":"mc","stem":"“我没穿过红色的”是什么意思？","opts":["Tôi chưa từng mặc đồ màu đỏ.","Tôi chỉ mặc đồ màu đỏ.","Tôi không thích mọi đồ màu đỏ."],"answer":0,"ex":"没穿过 = chưa từng mặc.","kind":"vocab"},{"id":"b4_009","section":"v2","type":"mc","stem":"你觉得这一件比上一件好看，应该怎么说？","opts":["这件条好看。","这件过好看。","这件更好看。"],"answer":2,"ex":"更 + tính từ để so sánh.","kind":"vocab"},{"id":"b4_010","section":"v2","type":"mc","stem":"书包在远处，你想让朋友跟你一起去看看，应该说：","opts":["那边有书包，我们过去看看。","你已经进去昨天了。","我去过来了。"],"answer":0,"ex":"过去: tới chỗ ở xa người nói.","kind":"vocab"},{"id":"b4_011","section":"v2","type":"mc","stem":"“因为太贵，所以我没买”说明什么？","opts":["没去过那个商场。","买了两件很贵的。","没买的原因是价格太高。"],"answer":2,"ex":"Vì quá đắt nên không mua.","kind":"vocab"},{"id":"b4_012","section":"v2","type":"mc","stem":"两条裤子都是红色的，一条更便宜。为了省钱，你应该选哪条？","opts":["更便宜的那条。","颜色更红的那个书包。","更贵的那条。"],"answer":0,"ex":"Cụm 更便宜的那条 chỉ chiếc rẻ hơn.","kind":"vocab"},{"id":"b4_013","section":"v3","type":"fill","stem":"我以前没去____这个商场。","answer":"过","ex":"没 + 去 + 过.","kind":"vocab"},{"id":"b4_014","section":"v3","type":"fill","stem":"门开了，我们____看看。","answer":"进去","ex":"Đi vào phía trong.","kind":"vocab"},{"id":"b4_015","section":"v3","type":"fill","stem":"小李想买一____白色的裤子。","answer":"条","ex":"Lượng từ quần dài.","kind":"vocab"},{"id":"b4_016","section":"v3","type":"fill","stem":"____我没有黑色的裤子，所以今天想买一条。","answer":"因为","ex":"Nguyên nhân ở đầu câu.","kind":"vocab"},{"id":"b4_017","section":"v3","type":"fill","stem":"这件红色的衣服有点儿大，我想先____一下。","answer":"试","ex":"Thử quần áo.","kind":"vocab"},{"id":"b4_018","section":"v3","type":"fill","stem":"那个黑色的很好看，但这个绿色的____好看。","answer":"更","ex":"So sánh mức độ.","kind":"vocab"},{"id":"b4_019","section":"v4","type":"mc","stem":"妈妈说：“你有很多白色的衣服了。”你以前没穿过红色的。应该怎么回答？","opts":["我已经穿过红色的十次了。","我没穿过红色的，想试试。","我不想买衣服，所以要买白色的。"],"answer":1,"ex":"Chưa từng mặc màu đỏ, muốn thử.","kind":"vocab"},{"id":"b4_020","section":"v4","type":"mc","stem":"两只书包：绿色的八十块，黑色的一百块。你只有九十块，买哪个？","opts":["绿色的。","两个都能买。","黑色的。"],"answer":0,"ex":"80 ≤ 90, 100 > 90.","kind":"vocab"},{"id":"b4_021","section":"v4","type":"mc","stem":"朋友问“为什么今天不去商场？”哪句逻辑正确？","opts":["我去商场因为所以绿色。","因为我去了，所以还没去过。","因为我要在家学习，所以不去了。"],"answer":2,"ex":"Vì phải học nên không đi.","kind":"vocab"},{"id":"b4_022","section":"v4","type":"mc","stem":"你拿着蓝色的裤子，店员说红色的更好看。店员建议你怎么做？","opts":["再买蓝色的。","试试红色的。","去买黑色的书包。"],"answer":1,"ex":"Căn cứ phát biểu màu đỏ đẹp hơn.","kind":"vocab"},{"id":"b4_023","section":"v4","type":"mc","stem":"小明去过商场，但没进去过书包店。哪句正确？","opts":["他以前到过商场，但没进过那家书包店。","他已经买过那家店的书包。","他从来没去过商场。"],"answer":0,"ex":"Phân biệt từng đến TTTM với chưa bước vào cửa hàng.","kind":"vocab"},{"id":"b4_024","section":"v4","type":"mc","stem":"这条白裤子五十块，红裤子六十块；小雪只带五十五块。她能买哪条？","opts":["两条都可以买。","红色的。","白色的。"],"answer":2,"ex":"55 có thể mua món 50, không đủ mua 60.","kind":"vocab"},{"id":"b4_025","section":"g1","type":"mc","stem":"小王去年____这家商场。","opts":["去过","更去","去所以"],"answer":0,"ex":"过 đặt sau động từ 去.","kind":"grammar"},{"id":"b4_026","section":"g1","type":"mc","stem":"你想问朋友有没有喝过红茶，应该说：","opts":["你喝了过红茶吗？","你喝过红茶吗？","你过喝红茶吗？"],"answer":1,"ex":"V + 过 + O + 吗.","kind":"grammar"},{"id":"b4_027","section":"g1","type":"mc","stem":"否定过去的经验，应说：","opts":["我没有穿了过黑色的。","我不穿过黑色的。","我没穿过黑色的。"],"answer":2,"ex":"Trải nghiệm phủ định 没(有)+V+过.","kind":"grammar"},{"id":"b4_028","section":"g1","type":"mc","stem":"你看____这部电影吗？（询问经历）","opts":["更","过","条"],"answer":1,"ex":"看过 = đã từng xem.","kind":"grammar"},{"id":"b4_029","section":"g1","type":"mc","stem":"“他没买过书包”最合适的理解是：","opts":["他以前没有买书包的经历。","他现在正在买书包。","他昨天一定买了书包。"],"answer":0,"ex":"没有买过 nói chưa từng trải nghiệm.","kind":"grammar"},{"id":"b4_030","section":"g1","type":"mc","stem":"____今天很冷，____我穿了很多衣服。","opts":["更……过……","先……以前……","因为……所以……"],"answer":2,"ex":"Nối nguyên nhân → kết quả.","kind":"grammar"},{"id":"b4_031","section":"g1","type":"mc","stem":"____这条裤子太贵了，我没有买。","opts":["所以","因为","过"],"answer":1,"ex":"因为 nêu lý do.","kind":"grammar"},{"id":"b4_032","section":"g1","type":"mc","stem":"“因为没穿过，所以想试试”中的结果是：","opts":["因为。","没穿过。","想试试。"],"answer":2,"ex":"Vế sau 所以 biểu thị kết quả.","kind":"grammar"},{"id":"b4_033","section":"g1","type":"mc","stem":"你为什么没有去商场？——____我生病了。","opts":["所以","因为","更"],"answer":1,"ex":"Trả lời hỏi nguyên nhân: 因为.","kind":"grammar"},{"id":"b4_034","section":"g1","type":"mc","stem":"她喜欢红色，____买了红色的裤子。","opts":["所以","过去","因为"],"answer":0,"ex":"Nguyên nhân → kết quả.","kind":"grammar"},{"id":"b4_035","section":"g1","type":"mc","stem":"你喜欢哪____？（省略“条裤子”）","opts":["所以","个去","条"],"answer":2,"ex":"哪条 có thể thay cho 哪条裤子.","kind":"grammar"},{"id":"b4_036","section":"g1","type":"mc","stem":"“红色的更好看”里的“的”指代：","opts":["一种以前去过的地方。","红色的那件衣服或那条裤子。","一个写字的动作。"],"answer":1,"ex":"的 thay danh từ đã biết.","kind":"grammar"},{"id":"b4_037","section":"g1","type":"mc","stem":"“这是我妈妈买____。”","opts":["的","因为","条"],"answer":0,"ex":"的 thay danh từ đã rõ trong ngữ cảnh.","kind":"grammar"},{"id":"b4_038","section":"g1","type":"mc","stem":"你想买白色的____黑色的？","opts":["因为","所以","还是"],"answer":2,"ex":"还是 nối hai lựa chọn trong câu hỏi.","kind":"grammar"},{"id":"b4_039","section":"g1","type":"mc","stem":"哪句话自然使用了“更”？","opts":["我觉得绿色的过漂亮。","我觉得绿色的更漂亮。","我觉得更绿色的过。"],"answer":1,"ex":"更 đứng trước tính từ.","kind":"grammar"},{"id":"b4_040","section":"g1","type":"mc","stem":"妈妈买的是白色的，我买的是____。","opts":["黑色的","更黑色条","黑色过"],"answer":0,"ex":"“的” thay danh từ sau tính từ màu sắc.","kind":"grammar"},{"id":"b4_041","section":"g2","type": ắm, thử đồ, quyết định.","kind":"writing"}],"tracks":[{"id":"L1","title":"第一次进商场 · Lần đầu đến trung tâm thương mại","role":"对话","turns":[["小雪","妈妈，今天我们去哪儿？"],["妈妈","我们去学校附近新开的商场看看。"],["小雪","我以前来过这个地方吗？我不记得了。"],["妈妈","你没来过。这家商场上个星期才开的。"],["小雪","太好了！我想买一条裤子，也想看看书包。"],["妈妈","现在人不太多。我们先进去看裤子吧。"],["小雪","好，我想看看有什么颜色的。"]],"questions":["小雪和妈妈要去哪里？","这家商场什么时候开的？","小雪以前来过这个商场吗？","她们决定先看什么？"],"proof":["去学校附近新开的商场","上个星期才开的","你没来过","先进去看裤子"]},{"id":"L2","title":"试试红色的 · Thử quần màu đỏ","role":"对话","turns":[["小雪","妈妈，我想买这条白色的裤子。"],["妈妈","你已经有两条白色的裤子了，为什么还买白色的？"],["小雪","因为我喜欢白色啊！"],["妈妈","我觉得这条白色的不太好看，你试试那条红色的吧。"],["小雪","可是我以前没穿过红色的。"],["妈妈","就是因为没穿过，所以更应该试试。"],["小雪","好吧。我试过以后也觉得红色的更好看。"],["妈妈","那我们买红色的吧。"]],"questions":["小雪先想买什么颜色的裤子？","妈妈为什么不想再买白色的？","小雪以前穿过红色的裤子吗？","最后她们想买哪条裤子？"],"proof":["这条白色的裤子","已经有两条白色的裤子","以前没穿过红色的","买红色的吧"]},{"id":"L3","title":"哪个书包更好 · Chọn cặp sách","role":"对话","turns":[["妈妈","裤子买好了。那边有一家卖书包的店，我们过去看看。"],["小雪","有红色的、绿色的和黑色的！真漂亮！"],["妈妈","你最喜欢哪一个？"],["小雪","我喜欢绿色的。我觉得绿色的比黑色的更好看。"],["妈妈","绿色的多少钱？黑色的呢？"],["店员","绿色的八十块，黑色的一百块。"],["小雪","我今天只带了九十块，买绿色的正好。"],["妈妈","好，你自己选的书包，明天就可以带去学校了。"]],"questions":["卖书包的店在哪里？","小雪觉得哪个书包更好看？","黑色的书包多少钱？","她为什么可以买绿色的却买不起黑色的？"],"proof":["那边有一家卖书包的店","绿色的比黑色的更好看","黑色的一百块","只带了九十块; 绿色的八十块"]},{"id":"L4","title":"我和妈妈的一天 · Nhật ký mua sắm","role":"独白","turns":[["小雪","上个星期六，我和妈妈去了学校附近一个新商场。那是我们第一次去那儿。商场里的人不太多，但是衣服的颜色很多。"],["小雪","我想买一条白色的裤子，因为家里有很多白色的衣服。妈妈说我应该试试别的颜色。"],["小雪","我以前从来没穿过红色的裤子，但是试了以后，觉得红色的比白色的更好看，所以最后买了红色的。"],["小雪","买完裤子，我们又过去看书包。我最喜欢绿色的，那个比黑色的便宜二十块钱。"],["小雪","回家以后，我给朋友发了消息。她问我明天穿什么去学校。我说：当然是今天新买的红色裤子！"]],"questions":["小雪和妈妈什么时候去商场的？","她为什么开始想买白色的裤子？","她最后买了什么颜色的裤子？","绿色的书包比黑色的便宜多少？"],"proof":["上个星期六","因为家里有很多白色的衣服","最后买了红色的","便宜二十块钱"]}],"readings":[{"id":"R1","name":"妈妈和女儿 · Cuối tuần đi mua sắm","text":"小雪：妈妈，今天我们去商场吗？\n妈妈：去。我们十点出门，先买裤子，再看书包。\n小雪：我想买白色的。\n妈妈：你已经有白色的了。我们先试试红色的，好吗？\n小雪：好。要是红色的更好看，我就买红色的。\n妈妈：买完以后，我们中午十二点回家吃饭。"},{"id":"R2","name":"给朋友的消息 · Tin nhắn sau khi thử đồ","text":"小文：你昨天买衣服了吗？\n小美：买了。我和姐姐去了一家新商场。\n小文：你买了什么颜色的？\n小美：我先试了绿色的，后来又试了红色的。姐姐说红色的更好看，所以我买了红色的。\n小文：多少钱？\n小美：六十块。我以前没买过红色的衣服，明天想穿去学校。"},{"id":"R3","name":"我的购物经历 · Một trải nghiệm","text":"我以前去过很多商场，但是上个星期第一次去了学校南边的那家。那天我和爸爸下午两点进去，四点才出来。我买了一条黑色的裤子，因为黑色的可以和我很多衣服一起穿。爸爸没买裤子，他给妹妹买了一个书包。书包是绿色的，妹妹很喜欢。"},{"id":"R4","name":"商场的小通知 · Thông báo cửa hàng","text":"欢迎来到我们新开的商场！今天是星期日，商场九点开门，晚上八点关门。一楼卖裤子和衣服，二楼卖书包。今天白色的裤子五十块，红色的裤子六十块，黑色的裤子七十块。买裤子以前，可以先试一试。因为今天人很多，所以请大家慢慢看。"}],"table":{"columns":["商品","颜色","价格","备注"],"rows":[["裤子","白色","50 元","可试"],["裤子","红色","60 元","可试"],["书包","绿色","80 元","不可试"],["书包","黑色","100 元","不可试"]]},"photos":{"red":{"uri":"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAcFBQYFBAcGBgYIBwcICxILCwoKCxYPEA0SGhYbGhkWGRgcICgiHB4mHhgZIzAkJiorLS4tGyIyNTEsNSgsLSz/2wBDAQcICAsJCxULCxUsHRkdLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCz/wgARCAKjBLADAREAAhEBAxEB/8QAGwAAAgMBAQEAAAAAAAAAAAAAAwQBAgUABgf/xAAaAQEBAQEBAQEAAAAAAAAAAAAAAQIDBAUG/9oADAMBAAIQAxAAAAH1fz6nwN613Ir2xHn3m+jmbnv03Ltm8Yr0jYdY3HOkyvKxvRz0+Osrcx/bj0HDWvw0lzZXoxieiLdMv5p+eh2A09j4+hrM7WXuenOl8P6cZPp1qcM7nkvaaC33KeXfnvRkXt56vq45vk6aXszk+arcdkU+oGK5q1gt227vMi5A7X0pRukFKBokNYrfmKMj6EsQ1C0Y1LblRjtn1npy/neC54/m6dWt6MYfn16L1YPYpm6FuKyPNrLb5Xo0erFmdP0ZHqOern53z7rl67150ufTjjD3x1MdfPedv+vL3LpWzA1yAs8dAt8749V1Qs6O1dxTjdDtj1ftyjyYHDe76saehZXufSTipx1QnHHHHHHEHHJ1cccQSQYfxO/Ulwq287Hdk8pnbmnx6aLW1y6QZvnmP6s+o5dMHrjR4b877fNIHDB9rZ8703zuieoSXzn0eNFHsDUeld4NXhtxcrpjW47P2eL7Yx/Vra8+RU5xvrNUB5yZg3vtecUmD5Oj3oxkeLqtik2NIGUFWUaaO2p0ufzje09AdL3aeei0JC6dDuMv4yThkewdzZ1rKzm2o/3y/wBselvRFjzPl6G6Za6ZQxdrvl23Ezna1tJnJzL42z8n0BzFvVh/bS9nIep5Lx9G+mdX049Dno1jY9RHfO3Dpns6PeaHLqDeMjfI7WV5N52ajzJZtK0uuRZoeda7c/Z+3K2b53y61PVjW2exs2dcccQcdXHJxBJBxxxxBxxyccdQuO0/m9MvxUWl/RnNkBoSz0fP0Lbxs8unmeXPH93Pa4dMX0cy4pLGPH0v6cos7Hk2/wAdZnXMmX7sKi3YKNjjoly559bubn3Ojz6X6zzGs+Z992PNnO7T3Xzul+sno8xcj6T0/wBLjXcU5af6Z8f83qrnRNRzJDVU2d5RvtNDQWN1sd6qdFru2N9YjZ5yFihWyDQ5R7jhrMvSoTUa6m949X6CuWBx0x0zo9cKZu1rVzzMw9qkMzMT5dGvldpAdY7ZsfV4L5vkvHvW9WIl2Omd7n26h6zk+LR/Zzb1Wee194 async function centerAI(data){if(!hasCenterAI())throw Error('Chưa thể kết nối tính năng nhận xét.');const rsp=await fetch(CENTER_AI_ENDPOINT,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});const ret=await rsp.json().catch(()=>null);if(!rsp.ok)throw Error(ret?.error||('Máy chủ AI trả về lỗi '+rsp.status));if(!ret||typeof ret!=='object')throw Error('Máy chủ AI trả về dữ liệu không hợp lệ');return ret;}
const H=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm=s=>String(s??'').normalize('NFKC').replace(/[\s，。、：；！!？?,.\-；：]/g,'').trim().toLowerCase();
const Q=Object.fromEntries(DB.questions.map(q=>[q.id,q]));
const G=g=>DB.questions.filter(q=>q.section===g);
const sel=(g)=>G(g).map(q=>q.id);
let S={answers:{},grades:{},page:-1,order:{},tokenOrders:{},review:{},submittedAt:null};
try{const old=JSON.parse(localStorage.getItem(STORAGE)||'null');if(old&&typeof old==='object')S={...S,...old,answers:old.answers||{},grades:old.grades||{},order:old.order||{},tokenOrders:old.tokenOrders||{},review:old.review||{}}}catch(e){}
const save=()=>{try{localStorage.setItem(STORAGE,JSON.stringify(S))}catch(e){}};
let current=S.page>=0&&S.page<4?S.page:0;
let busy=false,audioObjectUrls={L1:'h2-b4-nghe-1.mp3',L2:'h2-b4-nghe-2.mp3',L3:'h2-b4-nghe-3.mp3',L4:'h2-b4-nghe-4.mp3'},audioElements={},speech=null;
function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function seedOf(str){let h=2166136261>>>0;for(let i=0;i<str.length;i++){h^=str.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0}
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return ((t^t>>>14)>>>0)/4294967296}}
function seededShuffle(arr,seed){arr=[...arr];const rand=mulberry32(seedOf(seed));for(let i=arr.length-1;i>0;i--){const j=Math.floor(rand()*(i+1));[arr[i],arr[j]]=[arr[j],arr[i]]}return arr}
function initializeOrders(){
 const needsReset=S.orderVersion!==2||!S.order||typeof S.order!=='object';
 if(needsReset)S.order={};
 const groups={};DB.questions.filter(q=>q.type==='mc').forEach(q=>(groups[q.section]??=[]).push(q));
 for(const [sec,items] of Object.entries(groups)){
  const ordered=seededShuffle(items,sec+'-questions');
  const positions=seededShuffle(ordered.map((_,i)=>i%3),sec+'-positions');
  ordered.forEach((q,i)=>{
   const others=seededShuffle(q.opts.map((_,j)=>j).filter(x=>x!==q.answer),q.id+'-others');
   const slot=positions[i]%q.opts.length;
   others.splice(slot,0,q.answer);
   S.order[q.id]=others;
  });
 }
 for(const q of DB.questions.filter(q=>q.type==='order'))if(!S.tokenOrders[q.id])S.tokenOrders[q.id]=seededShuffle(q.tokens.map((_,i)=>i),q.id+'-tokens');
 S.orderVersion=2;
 save();
}
initializeOrders();

 document.getElementById('navbuttons').innerHTML=NAV.map((n,i)=>`<button class="navitem ${i===current?'active':''}" onclick="openPage(${i})" type="button">${H(n)}</button>`).join('');

 let done=DB.questions.filter(q=>answered(q)).length;document.getElementById('progress').style.width=(100*done/DB.questions.length).toFixed(1)+'%';
}

 document.getElementById('prev').disabled=i===0;document.getElementById('next').disabled=i===3;document.getElementById('footerLabel').textContent=`Chặng ${i+1}/4`;navRender();window.scrollTo({top:0,behavior:'instant'});
 if(i===2){for(const [id,url] of Object.entries(audioObjectUrls)){const a=document.getElementById('player-'+id);if(a){a.src=url;audioElements[id]=a;}}}if(i===3){renderReport();renderMistakes()}

function photo(key,caption=false){const p=DB.photos[key];return p?`<figure class="scene-card imgsmall"><img loading="lazy" src="${p.uri}" alt="${H(p.alt||key)}">${caption?`<figcaption class="subtle" style="padding:7px">${H(p.alt||'')}</figcaption>`:''}</figure>`:''}
function promptN(q){let id=DB.questions.indexOf(q)+1;return String(id).padStart(3,'0')}
function questionHTML(q){
 const a=S.answers[q.id],g=S.grades[q.id],graded=!!g;
 let body='';
 if(q.photo)body+=photo(q.photo);
 if(q.type==='mc'){
  const opts=S.order[q.id]||q.opts.map((_,i)=>i);
  body+=`<div class="choices">${opts.map((original,i)=>`<button type="button" aria-pressed="${a===original?'true':'false'}" class="choice ${a===original?'chosen':''} ${graded&&original===q.answer?'correct':''} ${graded&&a===original&&original!==q.answer?'incorrect':''}" onclick="choose('${q.id}',${original})">${'ABCDEF'[i]}. ${H(q.opts[original])}</button>`).join('')}</div>`;
 } else if(q.type==='fill'){
  body+=`<input class="hanzi-input" aria-label="Điền câu ${promptN(q)}" lang="zh-CN" value="${H(a??'')}" oninput="writeAnswer('${q.id}',this.value)" placeholder="请输入……">`;
 } else if(q.type==='order'){
  const chosen=Array.isArray(a)?a:[],order=S.tokenOrders[q.id]||q.tokens.map((_,i)=>i);
  body+=`<div class="assembled" lang="zh-CN">${chosen.map(i=>`<button class="token chosen" type="button" onclick="undoToken('${q.id}',${i})">${H(q.tokens[i])} ×</button>`).join('')||'<span class="subtle">点击词语，组成句子</span>'}</div><div class="tokens">${order.filter(i=>!chosen.includes(i)).map(i=>`<button class="token" onclick="pickToken('${q.id}',${i})" type="button">${H(q.tokens[i])}</button>`).join('')}</div><button type="button" class="btn light sm" onclick="clearOrder('${q.id}')">重排</button>`;
 } else {
  body+=`<textarea class="compose writing-input" aria-label="Viết câu ${promptN(q)}" id="answer-${q.id}" lang="zh-CN" placeholder="请用中文回答……" oninput="writeAnswer('${q.id}',this.value)">${H(a??'')}</textarea>`;
 }
 let fb=graded?`<div class="fb ${g.score>=.99?'good':'bad'}"><strong>${g.score>=.99?'✓ 正确':q.type==='open'?'✦ 已评价':'✕ 再想一想'}</strong>${H(g.feedback||q.ex||'')}${q.type==='open'&&g.rewrite?`<div lang="zh-CN">${H(g.rewrite)}</div>`:''}</div>`:'';
 return `<div class="q" id="q-${q.id}"><div class="qtitle"><span class="qindex">${promptN(q)}</span><strong lang="zh-CN">${H(q.stem)}</strong></div>${body}${fb}</div>`;
}
function replaceQ(id){const el=document.getElementById('q-'+id);if(el?.classList.contains('picwriting')){el.querySelector('.fb')?.remove();const g=S.grades[id];if(g){const box=document.createElement('div');box.className='fb '+(g.mode==='ai'?'good':'bad');box.textContent=g.feedback||'';el.appendChild(box)}navRender();return;}if(el){el.outerHTML=questionHTML(Q[id]);}navRender();}
function choose(id,answer){S.answers[id]=answer;delete S.grades[id];save();replaceQ(id)}
function writeAnswer(id,value){S.answers[id]=value;delete S.grades[id];save();const card=document.getElementById('q-'+id);if(card)card.querySelector('.fb')?.remove();navRender()}
function pickToken(id,token){const arr=S.answers[id]||[];if(arr.includes(token))return;S.answers[id]=[...arr,token];delete S.grades[id];save();replaceQ(id)}
function undoToken(id,token){S.answers[id]=(S.answers[id]||[]).filter(x=>x!==token);delete S.grades[id];save();replaceQ(id)}
function clearOrder(id){S.answers[id]=[];delete S.grades[id];save();replaceQ(id)}
function objective(q){const a=S.answers[q.id];let ok=false;if(q.type==='mc')ok=Number.isInteger(a)&&a===q.answer;
 else if(q.type==='fill')ok=norm(a)===norm(q.answer);
 else if(q.type==='order')ok=Array.isArray(a)&&a.length===q.answer.length&&a.every((pos,i)=>q.tokens[pos]===q.answer[i]);
 return {score:ok?1:0,mode:'automatic',feedback:q.ex||'',rewrite:''};}
function writingRule(q){return {score:0,mode:'pending',feedback:String(S.answers[q.id]||'').trim()?'Bài viết đang chờ nhận xét.':'Chưa có câu trả lời.',rewrite:q.model||''};}
function gradeGroup(sec){const arr=G(sec);arr.forEach(q=>S.grades[q.id]=q.type==='open'?(S.grades[q.id]?.mode==='ai'?S.grades[q.id]:writingRule(q)):objective(q));save();arr.forEach(q=>replaceQ(q.id));
 const score=arr.reduce((a,q)=>a+(S.grades[q.id]?.score||0),0),el=document.getElementById('score-'+sec);
 if(el)el.textContent=`${Math.round(score*100)/100}/${arr.length}`;
 if(sec.startsWith('L')){let transcript=document.getElementById('transcript-'+sec);if(transcript)transcript.hidden=false;}
}
function redoGroup(sec){if(!confirm('Làm lại phần này?'))return;for(const q of G(sec)){delete S.answers[q.id];delete S.grades[q.id];if(q.type==='mc')delete S.order[q.id];if(q.type==='order')S.tokenOrders[q.id]=shuffle(q.tokens.map((_,i)=>i));}
 initializeOrders();save();const y=window.scrollY;openPage(current);window.scrollTo(0,y)}

let recorder=null,recordPieces=[],speechRecording=null,speechRecordingURL=null,speechBusy=false;
async function beginRecord(){
 const stat=document.getElementById('micStat');
 if(!navigator.mediaDevices?.getUserMedia||!window.MediaRecorder){if(stat)stat.textContent='Trình duyệt không hỗ trợ ghi âm.';return}
 if(recorder?.state==='recording')return;
 try{
  const stream=await navigator.mediaDevices.getUserMedia({audio:true});
  recordPieces=[];speechRecording=null;
  const fb=document.getElementById('speechFeedback');if(fb){fb.textContent='';fb.className='ai-review-box';}
  recorder=new MediaRecorder(stream);
  recorder.ondataavailable=e=>{if(e.data.size)recordPieces.push(e.data)};
  recorder.onstop=()=>{
   speechRecording=new Blob(recordPieces,{type:recorder.mimeType||'audio/webm'});
   if(speechRecordingURL)URL.revokeObjectURL(speechRecordingURL);
   speechRecordingURL=URL.createObjectURL(speechRecording);
   const out=document.getElementById('micOut');if(out)out.innerHTML=`<audio controls src="${speechRecordingURL}"></audio>`;
   stream.getTracks().forEach(t=>t.stop());if(stat)stat.textContent='Đã ghi âm';
  };
  recorder.start();if(stat)stat.textContent='Đang ghi âm';
 }catch(e){if(stat)stat.textContent='Không mở được micro. Hãy cho phép truy cập micro hoặc mở trang bằng HTTPS.'}
}
function endRecord(){if(recorder?.state==='recording')recorder.stop()}
function audioBase64(blob){return new Promise((resolve,reject)=>{const f=new FileReader();f.onload=()=>resolve(String(f.result).split(',')[1]||'');f.onerror=()=>reject(Error('Không đọc được bản ghi âm'));f.readAsDataURL(blob)})}
async function reviewSpeaking(){
 const box=document.getElementById('speechFeedback'),btn=document.getElementById('speechAIButton');
 if(!box)return;
 const say=(msg,type='warn')=>{box.className='ai-review-box '+type;box.textContent=msg;};
 if(speechBusy)return;
 if(recorder?.state==='recording'){say('Hãy bấm Dừng trước khi xin nhận xét.');return}
 if(!speechRecording||speechRecording.size===0){say('Hãy ghi âm câu trả lời trước.');return}
 if(speechRecording.size>7*1024*1024){say('Bản ghi âm quá dài. Hãy ghi lại trong khoảng 30–60 giây.');return}
 if(!hasCenterAI()){say('Tính năng nhận xét hiện chưa khả dụng. Bạn có thể thử lại sau.');return}
 speechBusy=true;if(btn)btn.disabled=true;say('AI 小语 đang nghe và nhận xét bản ghi âm…','info');
 try{
  const data=await centerAI({action:'comment_speech',question:SPEECH_PROMPT,level:'HSK1–HSK2 Bài 4',audio:{mimeType:speechRecording.type||'audio/webm',base64:await audioBase64(speechRecording)}});
  if(typeof data.feedback!=='string'||!data.feedback.trim())throw Error('Máy chủ AI chưa trả nhận xét hợp lệ.');const score=data.score!==null&&data.score!==undefined&&Number.isFinite(Number(data.score))&&Number(data.score)>=0&&Number(data.score)<=10?`<p><b>Đánh giá nội dung: ${Math.min(10,Math.max(0,Number(data.score))).toFixed(1)}/10</b> <span class="subtle">(không cộng vào điểm tổng)</span></p>`:'';
  box.className='ai-review-box done';
  box.innerHTML=`${data.transcript?`<div><b>AI nghe được:</b> <span lang="zh-CN">${H(data.transcript)}</span></div>`:''}${score}<div><b>Nhận xét:</b> ${H(data.feedback||'Chưa nhận được nhận xét.')}</div>${data.suggestion?`<div><b>Gợi ý:</b> <span lang="zh-CN">${H(data.suggestion)}</span></div>`:''}`;
 }catch(e){say('Chưa thể nhận xét bản ghi âm: '+e.message)}
 finally{speechBusy=false;if(btn)btn.disabled=false}
}
function getCounts(){let O=DB.questions.filter(q=>q.type!=='open'),W=DB.questions.filter(q=>q.type==='open');let score=DB.questions.reduce((s,q)=>s+(S.grades[q.id]?.score||0),0);return {O,W,score,graded:DB.questions.filter(q=>S.grades[q.id]).length,rule:W.filter(q=>S.grades[q.id]?.mode!=='ai').length,answered:DB.questions.filter(answered).length}}
function gradePanel(){const d=getCounts();return `<article class="card"><h3>Điểm theo kỹ năng</h3><div id="reportBox"></div></article><article class="card"><h3>Nhận xét câu sai</h3><div id="mistakeBox"></div></article><article class="card" id="tong-ket"><h3>成绩 · Chấm toàn bộ bài</h3><div class="recap"><div class="subtle" id="resultLabel">${d.graded===DB.questions.length?'Kết quả của bạn':'Đã làm '+d.answered+'/'+DB.questions.length+' câu'}</div><div class="grade-banner"><strong id="resultNumber">${d.graded===DB.questions.length?(10*d.score/DB.questions.length).toFixed(2):'—'}</strong><span> /10</span><div class="tiny">Điểm bài viết sẽ được cập nhật khi có nhận xét AI.</div></div><div id="gradeSplit"></div></div><div class="group-actions"><button type="button" class="btn light sm" onclick="downloadProgress()">Xuất kết quả</button><button type="button" class="btn light sm" onclick="resetAll()">Làm lại từ đầu</button></div><div class="faint-status" id="gradeStatus" role="status" aria-live="polite"></div><button type="button" class="btn grade-action end-of-page-grade" id="globalGrade" onclick="gradeAll()">✓ CHẤM TOÀN BỘ</button></article>`;}
function renderReport(){let b=document.getElementById('reportBox');if(!b)return;
 const specs=[['Từ vựng',['v1','v2','v3','v4']],['Ngữ pháp',['g1','g2']],['Nghe hiểu',['l1']],['Đọc hiểu',['r1','r2']],['Giao tiếp / Viết AI',['w1','w2','w3','w4']]];
 b.innerHTML=`<div class="summary-pieces">${specs.map(([title,groups])=>{const qs=DB.questions.filter(q=>groups.includes(q.section)),real=qs.filter(q=>S.grades[q.id]&&S.grades[q.id].mode!=='pending'),pending=qs.filter(q=>S.grades[q.id]?.mode==='pending'),v=real.reduce((n,q)=>n+S.grades[q.id].score,0);return `<div class="skillbox"><div class="subtle">${title}</div><div class="value">${real.length?Math.round(100*v/real.length)+'%':pending.length?'Chờ AI':'—'}</div><div class="tiny">${real.length}/${qs.length} đã chấm${pending.length?' · '+pending.length+' chờ AI':''}</div></div>`}).join('')}</div>`;
 const d=getCounts(),done=d.graded===DB.questions.length,lb=document.getElementById('resultLabel'),num=document.getElementById('resultNumber'),split=document.getElementById('gradeSplit');
 if(lb)lb.textContent=done?(d.rule?'ĐIỂM TẠM TÍNH · phần tự luận còn chờ AI':'Điểm tổng hợp đã chấm'):'Đã trả lời '+d.answered+'/'+DB.questions.length+' mục';
 if(num)num.textContent=done?(10*d.score/DB.questions.length).toFixed(2):'—';
 if(split)split.innerHTML=done?`<div class="subtle">Khách quan: ${d.O.reduce((s,q)=>s+(S.grades[q.id]?.score||0),0).toFixed(0)}/${d.O.length} · Tự luận AI đã chấm ${d.W.filter(q=>S.grades[q.id]?.mode==='ai').length}/${d.W.length} · điểm phần viết đã xác nhận ${d.W.reduce((s,q)=>s+(S.grades[q.id]?.mode==='ai'?S.grades[q.id].score:0),0).toFixed(1)}/${d.W.length}</div>`:'';
}
function renderMistakes(){let b=document.getElementById('mistakeBox');if(!b)return;const wrong=DB.questions.filter(q=>S.grades[q.id]&&S.grades[q.id].score<.6&&(q.type!=='open'||S.grades[q.id].mode==='ai'));
 b.innerHTML=wrong.length?wrong.slice(0,50).map(q=>`<div class="list-error"><div class="subtle">${H(q.id)}</div><b lang="zh-CN">${H(q.stem)}</b><div>${H(S.grades[q.id].feedback||'')}</div><div class="subtle" lang="zh-CN">${H(q.model||q.opts?.[q.answer]||q.answer)}</div></div>`).join(''):'<p class="subtle">Chưa có câu cần sửa.</p>'}
function mergeAI(results,items){let done=0;for(const row of results){const q=items.find(x=>x.id===row.id);if(!q||typeof row.score!=='number'||!Number.isFinite(row.score)||row.score<0||row.score>1||typeof row.feedback!=='string'||!row.feedback.trim())continue;if(!String(S.answers[q.id]||'').trim())continue;S.grades[q.id]={score:row.score,mode:'ai',feedback:row.feedback,rewrite:String(row.rewrite||'')};done++;}return done;}
async function gradeWrittenGroup(sec){let qs=G(sec).filter(q=>q.type==='open'&&String(S.answers[q.id]||'').trim()&&S.grades[q.id]?.mode!=='ai');if(!qs.length){alert('Chưa có câu mới cần AI chấm trong vòng này.');return;}if(!hasCenterAI()){alert('Hiện chưa thể chấm tự luận bằng AI. Bạn có thể thử lại sau.');return}if(busy)return;busy=true;try{const results=await callAI(qs);const done=mergeAI(results,qs);save();qs.forEach(q=>replaceQ(q.id));alert('AI 小语 đã chấm '+done+'/'+qs.length+' câu.')}catch(e){alert('Chưa chấm AI được: '+e.message)}finally{busy=false}}
async function gradeAll(){if(busy)return;busy=true;let btn=document.getElementById('globalGrade'),status=document.getElementById('gradeStatus');if(btn)btn.disabled=true;if(status)status.textContent=`Đang chấm ${DB.questions.filter(q=>q.type!=='open').length} câu khách quan…`;
 for(const q of DB.questions){S.grades[q.id]=q.type==='open'?(S.grades[q.id]?.mode==='ai'?S.grades[q.id]:writingRule(q)):objective(q)}
 let need=DB.questions.filter(q=>q.type==='open'&&String(S.answers[q.id]||'').trim()&&S.grades[q.id]?.mode!=='ai');let msg=`Đã chấm ${DB.questions.filter(q=>q.type!=='open').length} câu khách quan; các câu viết đang chờ AI.`;
 if(need.length&&hasCenterAI()){try{if(status)status.textContent='Đang chấm bài tự luận với AI trung tâm…';const results=await callAI(need);const n=mergeAI(results,need);msg=n===need.length?`AI đã chấm ${n} câu được gửi.`:`AI đã chấm ${n}/${need.length} câu được gửi. Câu còn lại chưa chấm AI.`}catch(e){msg='Chưa thể chấm tự luận bằng AI: '+e.message}}
 else if(!need.length)msg='Đã chấm khách quan; các câu viết đã chấm AI hoặc chưa được trả lời.';
 S.submittedAt=Date.now();save();busy=false;openPage(3);const st=document.getElementById('gradeStatus');if(st)st.textContent=msg;document.getElementById('resultLabel')?.scrollIntoView({behavior:'smooth',block:'center'});
}
function downloadProgress(){let d={lesson:'HSK2-B4',total:DB.questions.length,submittedAt:S.submittedAt,answers:S.answers,grades:S.grades};const blob=new Blob([JSON.stringify(d,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='HSK2_Bai4_Ket_qua.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1200)}
