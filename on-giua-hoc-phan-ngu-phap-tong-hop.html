<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#c8eafb">
<title>Ôn tập giữa học phần – Ngữ pháp tổng hợp</title>
<style>
:root {
  --bg:#f4faff; --card:#ffffff; --ink:#20354c; --muted:#667d94;
  --line:#d6e8f6; --line2:#bddcf2; --accent:#62b5e8; --accent-dark:#287eb5;
  --accent-deep:#195e91; --pale:#e7f6ff; --pale2:#d6efff;
  --good:#15803d; --good-bg:#effcf4; --bad:#c53f43; --bad-bg:#fff2f2;
  --shadow:0 11px 30px rgba(31,92,138,.075);
  --top-h:77px; --tabs-h:62px;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:radial-gradient(ellipse at top left,#e9f7ff,transparent 47%),var(--bg);color:var(--ink);font-family:Inter,system-ui,-apple-system,'Segoe UI',Arial,'Microsoft YaHei',sans-serif}
button,input,textarea{font:inherit}
button{cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid #70c9fc;outline-offset:2px}
.topbar{position:sticky;top:0;z-index:40;background:rgba(255,255,255,.97);border-bottom:1px solid var(--line);backdrop-filter:blur(13px)}
.top-inner{max-width:1500px;margin:auto;padding:14px 22px;display:flex;justify-content:space-between;align-items:center;gap:16px}
.brand h1{font-size:23px;line-height:1.2;margin:0;letter-spacing:-.45px;color:#1d506e}
.meta{margin-top:6px;font-size:12px;color:var(--muted);font-weight:580}
.controls{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end;align-items:center}
.btn{border:1px solid var(--line2);border-radius:11px;color:var(--accent-deep);background:#fff;padding:10px 14px;font-weight:750;transition:background .15s,border-color .15s,transform .15s;white-space:nowrap}
a.btn{text-decoration:none;display:inline-flex;align-items:center;justify-content:center}
.btn:hover{background:#eaf7ff;border-color:var(--accent)}
.btn.primary{color:#fff;background:var(--accent-dark);border-color:var(--accent-dark);box-shadow:0 3px 9px rgba(40,126,181,.16)}
.btn.primary:hover{background:#216eaa}
.btn.ghost-danger{color:#a63c43}
.intro{max-width:1500px;margin:22px auto 12px;padding:0 22px}
.hero{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:24px;background:linear-gradient(122deg,#e0f4ff 0%,#f6fcff 63%,white 100%);border:1px solid #b8dff9;border-radius:23px;padding:24px 27px;box-shadow:var(--shadow);overflow:hidden;position:relative}
.hero:after{content:'';position:absolute;right:-68px;bottom:-106px;width:240px;height:240px;border:35px solid rgba(112,192,242,.13);border-radius:50%;pointer-events:none}
.eyebrow{color:var(--accent-deep);font-weight:850;font-size:11px;letter-spacing:1.6px;text-transform:uppercase}
.hero h2{font-size:27px;line-height:1.28;margin:8px 0 10px;color:#1d506e}
.hero p{font-size:14px;color:#4b718d;line-height:1.65;margin:5px 0}
.hero strong{color:#25658f}
.hero-stats{display:flex;gap:10px;flex-wrap:wrap;align-items:center;z-index:1}
.stat{background:#fff;min-width:100px;border:1px solid #cbe8fa;border-radius:16px;padding:12px 13px;text-align:center;box-shadow:0 4px 12px rgba(34,102,151,.07)}
.stat b{font-size:22px;color:#287eb5;display:block;line-height:1.1}
.stat span{display:block;margin-top:6px;font-size:11px;color:var(--muted)}
.intro details{margin-top:11px;background:#fff;border:1px solid var(--line);border-radius:12px;color:#547086;box-shadow:0 2px 10px rgba(43,110,158,.03)}
.intro summary{padding:11px 16px;cursor:pointer;font-size:13px;font-weight:760;color:#2b709e}
.scope-body{padding:0 18px 14px;font-size:13px;line-height:1.7}
.scope-body p{margin:5px 0}
.tabs-wrap{position:sticky;top:var(--top-h);z-index:35;background:rgba(244,250,255,.97);backdrop-filter:blur(12px);border-bottom:1px solid #d4e9f8;box-shadow:0 7px 17px rgba(34,99,145,.05)}
.tabs{max-width:1500px;margin:auto;padding:11px 22px;display:flex;gap:9px;overflow-x:auto;scrollbar-width:thin}
.tab{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line2);background:#fff;color:#366b8e;padding:10px 15px;border-radius:999px;white-space:nowrap;font-size:13px;font-weight:810;transition:.15s}
.tab em{font-size:10px;font-style:normal;border-radius:99px;background:#e6f5ff;padding:3px 6px}
.tab.active{color:white;background:#257fb6;border-color:#257fb6;box-shadow:0 3px 10px rgba(27,119,184,.13)}
.tab.active em{color:#195f92;background:#e2f4ff}
.layout{max-width:1320px;margin:14px auto 50px;padding:0 22px;display:block}
.main-content{min-width:0;width:100%}
.section{min-width:0}
.section-heading{margin-bottom:15px;padding:21px 24px 18px;border:1px solid var(--line);border-radius:18px;background:white;box-shadow:var(--shadow);border-left:6px solid var(--accent)}
.section-heading .section-label{display:flex;gap:10px;align-items:center;color:#4a91c0;font-size:11px;font-weight:850;letter-spacing:1.5px;text-transform:uppercase}
.section-heading h2{font-size:25px;margin:8px 0 5px;color:#1d506e;font-weight:840}
.section-heading .trans{font-weight:690;color:#3285b7;font-size:14px}
.section-heading .instruction{margin-top:10px;line-height:1.6;color:#667b8e;font-size:13px}
.paper{background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);margin-bottom:18px;overflow:hidden}
.paper-heading{display:flex;justify-content:space-between;align-items:center;gap:10px;border-bottom:1px solid var(--line);background:#f9fcff;padding:13px 19px;font-size:12px;font-weight:840;color:#457b9e}
.paper-heading .tiny{color:#7c94a6;font-weight:600}
.q-card{position:relative;padding:21px 22px 18px;border-bottom:1px solid #e8f1f9;scroll-margin-top:calc(var(--top-h) + var(--tabs-h) + 16px)}
.q-card:last-child{border-bottom:0}
.q-card.correct{background:linear-gradient(90deg,#f2fcf7,white 78%)}
.q-card.wrong{background:linear-gradient(90deg,#fff4f4,white 78%)}
.question-hd{display:flex;align-items:flex-start;gap:11px;padding-right:25px}
.number{display:inline-flex;align-items:center;justify-content:center;flex:0 0 34px;height:34px;border:1px solid #b5def8;border-radius:11px;background:#e8f6ff;color:#236d9e;font-size:13px;font-weight:900}
.q-stem{font-family:system-ui,'Noto Sans CJK SC','Microsoft YaHei',sans-serif;font-size:17px;line-height:1.8;min-width:0;overflow-wrap:anywhere;flex:1}
.q-card.wrong .mark,.q-card.correct .mark{display:block}
.mark{display:none;position:absolute;top:20px;right:20px;font-size:26px;line-height:1;font-weight:900}
.q-card.correct .mark{color:var(--good)}.q-card.wrong .mark{color:var(--bad)}
.question-options{margin:14px 0 0 45px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}
.opt{border:1px solid #ddeaf6;background:#fbfdff;color:#344f66;border-radius:11px;padding:10px 13px;text-align:left;display:flex;gap:10px;align-items:flex-start;line-height:1.55;font-size:14px;transition:.14s}
.opt:hover{background:#eff9ff;border-color:#aad9f4}
.opt .letter{display:inline-flex;align-items:center;justify-content:center;flex:0 0 23px;height:23px;border-radius:7px;background:#e8f3fb;color:#347dab;font-size:12px;font-weight:850}
.opt.selected{background:#dff2ff;border-color:#4da9df;color:#165b89;box-shadow:inset 0 0 0 1px rgba(64,162,218,.18)}
.opt.selected .letter{background:#3185b8;color:white}
.sentences{margin:13px 0 5px 45px;padding:13px 16px;background:#f4faff;border:1px solid #d6eafb;border-radius:11px}
.sentences p{margin:5px 0;line-height:1.85;color:#34516a;font-size:15px}
.explanation{margin:9px 0 0 45px;color:#566c7d;font-size:15px;line-height:1.85}
.explanation strong{color:#387fa9}
.word-instruction{margin:7px 0 8px 45px;color:#6b8699;font-size:12px}
.write-box{display:block;width:calc(100% - 45px);margin:12px 0 0 45px;min-height:90px;resize:vertical;border:1px solid #c9e4f5;border-radius:12px;padding:12px 13px;background:#fafeff;color:#23445e;font-size:15px;line-height:1.75}
.write-box:focus{background:white;border-color:#6bb8e9}
.feedback{display:none;margin:13px 0 0 45px;padding:11px 13px;border-radius:11px;font-size:13px;line-height:1.7}
.feedback.show{display:block}
.feedback.bad{background:#fff4f4;border:1px solid #f5b3b3;color:#913f42}
.feedback.good{background:#edfbf3;border:1px solid #a3dfb9;color:#287045}
.feedback.sample{background:#f0f9ff;border:1px solid #b8e2f8;color:#24638e}
.article{padding:20px 23px;border-bottom:1px solid var(--line);background:linear-gradient(110deg,#f3fbff,#fff)}
.article-tag{font-weight:870;font-size:13px;color:#267cae;margin:0 0 12px}
.article p{font-family:system-ui,'Microsoft YaHei',sans-serif;font-size:16px;line-height:2.05;margin:10px 0;color:#2d4962;text-align:justify}
.article-note{border-left:3px solid #84bfe3;padding-left:10px;font-size:11px;color:#678397}
/* Phiếu trả lời bên phải đã được bỏ; tất cả thao tác làm bài ở câu hỏi. */
.review-status{margin-bottom:16px;padding:15px 21px;background:#fff;border:1px solid var(--line);border-radius:17px;box-shadow:var(--shadow);scroll-margin-top:calc(var(--top-h) + var(--tabs-h) + 15px)}
.review-status-head{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px}
.review-status h2{font-size:14px;color:#285d7b;margin:0}
.review-status-sub{color:#7793a7;font-size:12px}
.progress-row{display:flex;gap:12px;align-items:center;color:#69839a;font-size:12px;font-weight:730;margin-top:11px}
.progress{height:9px;flex:1;border-radius:99px;background:#ecf4fa;overflow:hidden}
.progress span{display:block;height:100%;background:linear-gradient(90deg,#a7d9f8,#4dace3);width:0%;transition:width .15s}
.total-row{margin-top:8px;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;color:#7290a7;font-size:11px}
.result{display:none;padding:15px 17px;border:1px solid #b6dff6;border-radius:11px;background:#edfbff;margin-top:13px;font-size:13px;line-height:1.8;color:#246080;scroll-margin-top:calc(var(--top-h) + var(--tabs-h) + 22px)}
.result.show{display:block}
.result .score-big{display:block;font-size:23px;font-weight:900;color:#1f74a8;margin:4px 0}
.result .btn{margin-top:7px;font-size:12px;white-space:normal;text-align:left}
.modal{position:fixed;z-index:70;inset:0;background:rgba(24,56,80,.62);display:none;align-items:center;justify-content:center;padding:16px}
.modal.show{display:flex}.modal-card{width:min(560px,100%);max-height:92vh;overflow:auto;background:#fff;border-radius:19px;border:1px solid #d4ebfa;box-shadow:0 22px 70px rgba(7,51,86,.3)}
.modal-header{padding:19px 21px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:14px}
.modal-header h2{font-size:20px;color:#22648d;margin:0}
.modal-body{padding:21px;font-size:13px;line-height:1.65;color:#58758a}
.modal-body label{display:block;font-size:12px;color:#386783;font-weight:750;margin-top:13px;margin-bottom:5px}
.modal-body input{width:100%;padding:11px 13px;border:1px solid var(--line2);border-radius:10px}
.modal-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:20px;flex-wrap:wrap}
.ai-status{display:none;margin-top:12px;padding:11px 12px;background:#ecf8ff;border:1px solid #bee2f9;border-radius:10px;white-space:pre-wrap}
.ai-status.show{display:block}
.ai-feedback{display:none;padding:10px 12px;margin:10px 0 0 45px;font-size:12px;line-height:1.65;border-radius:10px;background:#edf8ff;border:1px solid #b8e1f7;color:#285d80}
.ai-feedback.show{display:block}.ai-feedback.pass{background:#effcf4;border-color:#a7dbb9;color:#277a45}.ai-feedback.fail{background:#fff5f5;border-color:#f3b9bc;color:#9f4949}
.footnote{max-width:1500px;margin:0 auto 30px;padding:0 22px;color:#7c95a7;font-size:12px}
.hidden{display:none!important}
@media(max-width:1100px){.hero-stats{max-width:230px}}
@media(max-width:850px){.hero{grid-template-columns:1fr}.hero-stats{max-width:none}.hero h2{font-size:23px}}
@media(max-width:560px){.top-inner{padding:12px 14px;align-items:flex-start}.brand h1{font-size:18px}.meta{font-size:10px}.controls .btn{font-size:12px;padding:8px 10px}.intro{padding:0 12px;margin-top:14px}.hero{padding:17px}.hero-stats .stat{min-width:78px;padding:10px}.tabs{padding:9px 12px}.tab{font-size:12px;padding:9px 10px}.layout{padding:0 12px;gap:12px;margin-top:12px}.question-options{grid-template-columns:1fr}.review-status{padding:13px}.q-card{padding:16px 12px}.question-options,.sentences,.explanation,.word-instruction,.feedback,.ai-feedback{margin-left:0}.write-box{margin-left:0;width:100%}.q-stem{font-size:15px}.paper-heading{padding:11px}.section-heading{padding:17px}.section-heading h2{font-size:21px}.article{padding:14px}.article p{font-size:15px}}
@media print{.topbar,.tabs-wrap,.review-status,.intro details,.controls,.footnote{display:none!important}.layout{display:block;max-width:none;padding:0}.section{display:block!important}.section-heading,.paper{box-shadow:none;break-inside:avoid}.question-options button{border-color:#ddd}.q-card{break-inside:avoid}.intro{margin-top:0}.hero{box-shadow:none}}
</style>

<body>
<header class="topbar"><div class="top-inner">
  <div class="brand"><h1>Ôn tập giữa học phần – Ngữ pháp tổng hợp</h1><div class="meta">跨越篇 1 · 第 1—5 课 &nbsp;|&nbsp; 123 câu · 7 dạng bài</div></div>
  <div class="controls"><a class="btn" href="https://sites.google.com/view/tiengtrunghaiyen-hanu/t%C3%A0i-li%E1%BB%87u-mi%E1%BB%85n-ph%C3%AD/t%C3%A0i-li%E1%BB%87u-%C3%B4n-t%E1%BA%ADp-t%E1%BB%95ng-h%E1%BB%A3p/th%E1%BB%B1c-h%C3%A0nh-ti%E1%BA%BFng-t%E1%BB%95ng-h%E1%BB%A3p" target="_top">← Quay lại mục lục</a><button class="btn ghost-danger" id="resetBtn" type="button">Làm lại</button><button class="btn primary" id="submitBtn" type="button">Nộp bài và chấm điểm</button></div>
</div></header>
<nav class="tabs-wrap" aria-label="Chọn phần ôn tập"><div class="tabs" id="tabs"></div></nav>
<div class="layout">
<div class="review-status" aria-label="Tiến độ và kết quả ôn tập">
  <div class="review-status-head"><h2>Tiến độ làm bài</h2><span class="review-status-sub" id="sectionStatus">选词填空 · Chọn từ điền chỗ trống</span></div>
  <div class="progress-row"><span id="progressText">0/36</span><div class="progress" aria-hidden="true"><span id="progressFill"></span></div></div>
  <div class="total-row"><span id="globalProgress">0/123 câu đã làm</span><span id="autoSaved">Tự lưu trên trình duyệt</span></div>
  <div class="result" id="resultBox" role="status" aria-live="polite"></div>
</div>
<main class="main-content" id="mainContent"></main>

local":1,"article":2,"stem":"阿杰提出的方案在场地安排上有问题。","opts":{"对":"Đúng · 对","错":"Sai · 错"},"answer":"对"},{"n":7,"local":2,"article":2,"stem":"负责人没有提到方案的任何优点。","opts":{"对":"Đúng · 对","错":"Sai · 错"},"answer":"错"},{"n":8,"local":3,"article":2,"stem":"阿杰后来修改了方案。","opts":{"对":"Đúng · 对","错":"Sai · 错"},"answer":"对"},{"n":9,"local":4,"article":2,"stem":"负责人认为任何情况下都不该直接说话。","opts":{"对":"Đúng · 对","错":"Sai · 错"},"answer":"错"},{"n":10,"local":5,"article":2,"stem":"短文赞成结合具体情境选择表达方式。","opts":{"对":"Đúng · 对","错":"Sai · 错"},"answer":"对"}],"count":10}],"articles":{"read":[{"title":"阅读一 · 步行与生活节奏","paragraphs":["城市生活节奏越来越快，不少人出门时首先想到的是汽车、地铁或网约车。小林也曾如此：从住处到公司只有两站地铁，她却很少步行。一次地铁临时停运，小林只好沿街走去上班。不料，这段原本让她担心迟到的路，却使她发现了附近的一座小公园、几家社区书店，还有早餐店门口热情打招呼的邻居。","从那天起，小林尝试每周选择两三天提前出门，用步行代替一段短途乘车。最初她觉得多走路会浪费时间，后来发现自己能借此调整心情，还能在路上思考工作中的问题。她也明白，步行并不适合取代所有交通工具：赶时间、天气恶劣或距离太远时，仍应选择更合适的方式。对她来说，重要的不是每天走多少公里，而是主动给生活留一点儿观察和体验的空间。"]},{"title":"阅读二 · 一家小企业的海外尝试","paragraphs":["华新是一家生产小型家用电器的企业。最初，管理层以为只要把国内畅销的产品直接卖到海外，就一定会取得好成绩。然而，第一批产品的销售情况并不理想。市场调查发现，部分家庭的厨房面积较小，原有产品的体积不合适；不少顾客还希望能通过当地语言得到维修帮助。","公司随即调整策略：研发人员重新设计了几种小型产品，销售团队与当地商店合作，售后部门则培训熟悉当地语言的员工。为了避免只追求短期销量，公司还定期收集顾客意见，根据实际使用情况改进功能。一年后，新产品的市场反应逐渐好转。负责人在总结时说，这次成绩不能只归功于广告，而是来自调查、研发、销售和售后团队的共同努力。他还指出，进入新市场不等于简单复制旧经验，真正了解消费者才是重要的一步。"]}],"truefalse":[{"title":"阅读三 · 家庭中的责任","paragraphs":["高三毕业后，小辰准备离开家去另一座城市读大学。母亲一向关心他的生活，连买车票、收拾行李都想替他完成。小辰却提出，希望由自己规划出行和住宿。母亲起初感到有些失落，父亲建议她不妨先听听孩子的计划。小辰拿出一张表，上面写着车次、学校地址、报到时间以及需要携带的证件。母亲看完以后，放心了许多，但仍再三提醒他注意安全。到校后，小辰按约定给家里报平安，也会主动处理生活中的小问题。母亲后来发现，孩子有能力时适当放手，并不是减少关心，而是让关心变得更有分寸。"]},{"title":"阅读四 · 说话需要分寸","paragraphs":["一家机构准备举办环保讲座。筹备会上，新同事阿杰提出了一个方案，但场地安排存在问题。负责人没有当众批评他，而是先肯定了内容设计中的新意，再请他考虑如果听众人数增加，座位是否足够。阿杰听懂了提醒，随即修改了方案。另一位同事却觉得这样的表达太委婉，可能浪费时间。负责人解释说，面对紧急危险时，应当直截了当地提醒；但讨论普通工作方案时，清楚表达事实并照顾他人的感受，往往更能推动合作。会议结束后，阿杰主动表示感谢。对他来说，既指出问题又尊重人的建议，比简单说“你错了”更容易接受。"]}]},"scope":["Nhóm từ chính thức ở mục 辨析近义词 của năm bài:","• Bài 1: 看起来/看来；随着/伴随；毫无/毫不；造成/引起。","• Bài 2: 再三/不断；培养/教育；一向/一直；只管/尽管。","• Bài 3: 暗暗/偷偷；随即/随后；猛然/突然。","• Bài 4: 以致/因此；眼前/面前；体验/体会；从……来说/对……来说。","• Bài 5: 提供/供应；这样一来/于是；从而/因此。","Chủ đề bài khóa và đọc mở rộng: bảo vệ động vật – môi trường; cha mẹ và sự trưởng thành; giao tiếp khéo léo; đi bộ và sức khỏe; doanh nghiệp – sản phẩm – thị trường – dịch vụ.","Lưu ý: Một số từ và kết cấu bổ trợ (如 要不是……就……、巴不得、费尽心机等) được đưa vào để luyện cùng mức độ HSK5/giáo trình; không coi đây là bản sao mục lục hoặc từ điển phân cấp HSK."]};

 }).join('');}

 '看起来':'“看起来” miêu tả cảm nhận trực tiếp về vẻ bề ngoài hoặc trạng thái.','看来':'“看来” dùng khi người nói rút ra nhận định từ tình huống.','随着':'“随着” nêu sự thay đổi diễn ra cùng một quá trình.','伴随':'“伴随” mang nghĩa đi kèm, cùng xuất hiện với sự vật khác.',
 '毫无':'“毫无” đứng trước danh từ, nghĩa là hoàn toàn không có.','毫不':'“毫不” đứng trước động từ hoặc tính từ, nghĩa là hoàn toàn không.','造成':'“造成” thường đi với kết quả hay thiệt hại cụ thể.','引起':'“引起” nhấn mạnh việc gây ra phản ứng, sự chú ý hoặc thảo luận.',
 '再三':'“再三” chỉ hành động được lặp lại nhiều lần có chủ ý.','不断':'“不断” chỉ quá trình liên tục, không ngừng.','培养':'“培养” dùng với năng lực, thói quen hoặc nhân tài.','教育':'“教育” dùng khi giáo dục, khuyên răn con người.',
 '一向':'“一向” nêu đặc điểm hoặc thói quen nhất quán từ trước đến nay.','一直':'“一直” nhấn mạnh hành động hoặc trạng thái kéo dài liên tục.','只管':'“只管” có nghĩa cứ việc, không cần ngại.','尽管':'“尽管” mở đầu mệnh đề nhượng bộ: mặc dù… nhưng…',
 '暗暗':'“暗暗” chỉ suy nghĩ hoặc quyết tâm thầm trong lòng.','偷偷':'“偷偷” chỉ hành động làm lén, không để người khác biết.','随即':'“随即” nhấn mạnh hành động xảy ra ngay sau đó.','随后':'“随后” chỉ bước tiếp theo trong trình tự.',
 '猛然':'“猛然” nhấn mạnh động tác bất ngờ và mạnh.','突然':'“突然” nêu sự việc bất ngờ xảy ra.','以致':'“以致” dẫn ra hậu quả, thường là kết quả không mong muốn.','因此':'“因此” nêu kết quả logic: vì vậy/do đó.',
 '眼前':'“眼前” chỉ trước mắt hoặc tình hình hiện tại.','面前':'“面前” chỉ vị trí phía trước một người hay tập thể.','体验':'“体验” là trực tiếp tham gia để trải nghiệm.','体会':'“体会” là hiểu, cảm nhận sâu sắc sau khi trải qua.',
 '从……来说':'“从……来说” nêu góc độ hoặc phương diện đánh giá.','对……来说':'“对……来说” nêu đối tượng mà nhận xét áp dụng.','提供':'“提供” dùng rộng cho thông tin, dịch vụ, điều kiện hoặc vật phẩm.','供应':'“供应” nhấn mạnh cung ứng vật tư/hàng hóa đều đặn.',
 '这样一来':'“这样一来” nêu hệ quả của toàn bộ cách làm vừa nói.','于是':'“于是” dẫn sang hành động tiếp theo do tình huống trước đó.','从而':'“从而” nối biện pháp/quá trình với kết quả đạt được.'
};
function simpleExplanation(s,q){
 const correctLabel=(q.opts&&q.opts[q.answer])||q.answer;
 if(s.id==='fill')return TERM_NOTES[correctLabel]||`Đây là từ phù hợp với ngữ cảnh và cách kết hợp từ trong câu.`;
 if(s.id==='sort')return `Câu đầu nêu bối cảnh, các câu sau phát triển theo quan hệ thời gian–nguyên nhân–kết quả, nên thứ tự hợp lý là ${q.correctSequence}.`;
 if(s.id==='wrong')return `Câu này dùng từ hoặc cấu trúc chưa đúng ngữ cảnh; thay theo câu gợi ý sẽ đúng nghĩa và tự nhiên hơn.`;
 if(s.id==='terms')return q.answer==='对'?`Lời giải thích phù hợp với nghĩa và cách dùng của từ trong câu.`:`Lời giải thích đã nêu sai nghĩa hoặc giới hạn cách dùng của từ trong câu.`;
 if(s.id==='read')return `Chi tiết trong bài đọc phù hợp với phương án “${correctLabel}”.`;
 if(s.id==='truefalse')return q.answer==='对'?`Nhận định này phù hợp với thông tin được nêu trong bài đọc.`:`Nhận định này trái với hoặc không đúng theo thông tin trong bài đọc.`;
 return `Đáp án này phù hợp với nội dung và ngữ cảnh của câu.`;
}
function gradeObjective(s,q){const v=vals[key(s.id,q.n)]||'',pass=v===q.answer;
 const label=q.opts[q.answer]||q.answer;
 let detail=`<strong>Đáp án đúng:</strong> ${esc(q.answer)}. ${esc(label)}`;
 if(s.id==='sort')detail+=`<br><strong>Trình tự:</strong> ${esc(q.correctSequence)}`;
 if(s.id==='wrong')detail+=`<br><strong>Gợi ý sửa:</strong> ${esc(q.fix)}`;
 detail+=`<br><strong>Giải thích:</strong> ${esc(simpleExplanation(s,q))}`;
 return {pass,detail};}
function applyMarking(){if(!submitted)return;
 for(const s of DATA.sections)for(const q of s.questions){const k=key(s.id,q.n),el=document.getElementById('q-'+k),row=document.getElementById('row-'+k);
 if(s.id==='writing'){
  const ai=aiGrades[q.n];
  if(ai&&el){const pass=Number(ai.score)>=1;el.classList.toggle('correct',pass);el.classList.toggle('wrong',!pass);const mark=el.querySelector('.mark');if(mark){mark.textContent=pass?'✓':'✕';mark.setAttribute('aria-label',pass?'Đúng':'Sai');}}
  if(ai&&Number(ai.score)<1){
   const detail=`<strong>Điểm cần sửa:</strong> ${esc(ai.feedback||'Câu chưa đúng.')}<br><strong>Câu sửa gợi ý:</strong> <span lang="zh-Hans">${esc(ai.suggestion||q.sample)}</span>`;
   showFeedback(document.getElementById('feedback-'+k),detail,'bad');
  }
 }else{
  const {pass,detail}=gradeObjective(s,q);
  if(el){el.classList.toggle('correct',pass);el.classList.toggle('wrong',!pass);const mark=el.querySelector('.mark');if(mark){mark.textContent=pass?'✓':'✕';mark.setAttribute('aria-label',pass?'Đúng':'Sai');}}
  if(row){row.classList.toggle('correct',pass);row.classList.toggle('wrong',!pass);}
  if(!pass){showFeedback(document.getElementById('feedback-'+k),detail,'bad');showFeedback(document.getElementById('sidefeedback-'+k),detail,'bad');}
 }
 }
}
function score(){let scores={},total=0;
 for(let s of DATA.sections)if(s.id!=='writing'){let n=s.questions.filter(q=>vals[key(s.id,q.n)]===q.answer).length;scores[s.id]=n;total+=n;}
 return {scores,total};}
function updateResults(){const box=document.getElementById('resultBox');if(!submitted&&!aiGrading){box.classList.remove('show');return;}
 const {scores,total}=score(),items=Object.values(aiGrades),writingComplete=items.length===20;
 const writingScore=writingComplete?items.reduce((sum,item)=>sum+Number(item.score||0),0):0;
 box.classList.add('show');
 if(aiGrading){box.innerHTML='<strong>Đang chấm bài…</strong><span class="score-big">Vui lòng chờ</span><div>Hệ thống đang chấm phần 四 và tổng hợp kết quả.</div>';return;}
 const displayWriting=Number.isInteger(writingScore)?String(writingScore):writingScore.toFixed(1);
 box.innerHTML=`<strong>Kết quả</strong><span class="score-big">${total+writingScore}/${TOTAL} điểm</span>`+
 DATA.sections.filter(s=>s.id!=='writing').map(s=>`<div>${esc(s.short)}: <b>${scores[s.id]}/${s.count}</b></div>`).join('')+
 `<div>Đặt câu: <b>${displayWriting}/20</b></div>`;
}
function haiyenReceiveAiGrade(message){
 if(!message||message.type!=='haiyen-ai-feedback'||!pendingAiGrades.has(message.requestId))return;
 const pending=pendingAiGrades.get(message.requestId);pendingAiGrades.delete(message.requestId);if(pending.script)pending.script.remove();
 if(!message.ok)pending.reject(new Error((message.payload&&message.payload.error)||'Không thể chấm câu này.'));else pending.resolve(message.payload||{});
}
function requestAIGrade(q,answer){return new Promise((resolve,reject)=>{
 const requestId='grammar-mid-'+q.n+'-'+Date.now()+'-'+Math.random().toString(36).slice(2);
 const fields=new URLSearchParams({mode:'grade_hsk4_picture_sentence',requestId,studentAnswer:answer,keyword:q.stem||'',reference:q.sample||''});
 const script=document.createElement('script');pendingAiGrades.set(requestId,{resolve,reject,script});script.src=AI_GRADER_URL+'?'+fields.toString();
 script.onerror=()=>haiyenReceiveAiGrade({type:'haiyen-ai-feedback',requestId,ok:false,payload:{error:'Không thể kết nối tới hệ thống chấm điểm.'}});document.body.appendChild(script);
 setTimeout(()=>{if(pendingAiGrades.has(requestId))haiyenReceiveAiGrade({type:'haiyen-ai-feedback',requestId,ok:false,payload:{error:'Hệ thống phản hồi quá lâu.'}})},45000);
});}
function askConfirm(message,confirmText){return new Promise(resolve=>{
 const layer=document.createElement('div');layer.className='modal show';layer.innerHTML=`<div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="confirm-title"><div class="modal-header"><h2 id="confirm-title">Xác nhận</h2></div><div class="modal-body"><p>${esc(message)}</p><div class="modal-actions"><button class="btn" type="button" data-confirm="cancel">Hủy</button><button class="btn primary" type="button" data-confirm="ok">${esc(confirmText||'Đồng ý')}</button></div></div></div>`;
 const finish=value=>{layer.remove();resolve(value)};layer.addEventListener('click',e=>{const action=e.target.closest('[data-confirm]')?.dataset.confirm;if(action)finish(action==='ok');});document.body.appendChild(layer);layer.querySelector('[data-confirm="ok"]').focus();
 });}
async function submit(){if(aiGrading)return;const missing=TOTAL-allAnswered();if(missing>0&&!await askConfirm(`Bạn còn ${missing} câu chưa trả lời. Các câu trống sẽ được tính 0 điểm. Bạn vẫn muốn nộp bài?`,'Vẫn nộp bài'))return;
 aiGrading=true;submitted=false;aiGrades={};const btn=document.getElementById('submitBtn');btn.disabled=true;btn.textContent='Đang chấm bài…';clearMarks();updateResults();
 const writing=findSection('writing').questions,fresh={};
 try{
  const tasks=writing.map(q=>{const answer=String(vals[key('writing',q.n)]||'').trim();if(!answer){fresh[q.n]={score:0,feedback:'Câu trả lời đang để trống.',suggestion:q.sample};return Promise.resolve();}
   return requestAIGrade(q,answer).then(p=>{const score=Math.max(0,Math.min(1,(Number(p.score)||0)/10));fresh[q.n]={score,feedback:String(p.feedback||p.verdict||'Câu chưa đúng.'),suggestion:String(p.corrected_sentence||q.sample)};});});
  await Promise.all(tasks);aiGrades=fresh;submitted=true;aiGrading=false;applyMarking();updateResults();save();document.getElementById('resultBox').scrollIntoView({behavior:'smooth',block:'nearest'});
 }catch(e){submitted=false;const box=document.getElementById('resultBox');box.classList.add('show');box.innerHTML='<strong>Chưa thể chấm bài</strong><div>'+esc(e.message||'Vui lòng thử lại sau.')+'</div>';
 }finally{aiGrading=false;btn.disabled=false;btn.textContent='Nộp bài và chấm điểm';}
}
async function reset(){if(!await askConfirm('Xóa toàn bộ câu trả lời, kết quả chấm và làm lại từ đầu?','Xóa và làm lại'))return;
 vals={};aiGrades={};submitted=false;aiGrading=false;active='fill';try{localStorage.removeItem(STORAGE_KEY)}catch(e){}
 renderTabs();renderSections();updateProgress();updateResults();window.scrollTo({top:0,behavior:'smooth'});save();}
function updateSticky(){const a=document.querySelector('.topbar'),b=document.querySelector('.tabs-wrap');document.documentElement.style.setProperty('--top-h',Math.ceil(a.getBoundingClientRect().height)+'px');document.documentElement.style.setProperty('--tabs-h',Math.ceil(b.getBoundingClientRect().height)+'px');}
// Bấm đáp án trực tiếp ngay tại câu hỏi.
document.addEventListener('click',ev=>{const t=ev.target.closest('button');if(!t)return;
 if(t.dataset.tab){chooseSection(t.dataset.tab);return;}
 if(t.dataset.key){chooseAnswer(t.dataset.key,t.dataset.value);return;}
 if(t.dataset.jump){jump(t.dataset.jump);return;}
});
document.addEventListener('input',ev=>{if(ev.target.dataset.write)editWriting(ev.target.dataset.write,ev.target.value);});
document.getElementById('submitBtn').addEventListener('click',submit);
document.getElementById('resetBtn').addEventListener('click',reset);
window.addEventListener('resize',updateSticky);
window.addEventListener('load',updateSticky);
restore();renderTabs();renderSections();updateProgress();updateResults();requestAnimationFrame(updateSticky);
</script>
